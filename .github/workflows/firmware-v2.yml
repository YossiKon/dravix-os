# Compiles the v2 firmware (deploy/esphome/v2) on GitHub's runners, so a broken lambda is caught
# here instead of after a 15-minute Install on the robot owner's Home Assistant box.
# Runs only for the v2 branch (and by hand); it never builds or publishes the add-on.
name: firmware-v2

on:
  push:
    branches: [v2, v2-games]
    paths:
      - "deploy/esphome/v2/**"
      - "components/**"
      - ".github/workflows/firmware-v2.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 2026.8.2 = the owner's last known ESPHome; "latest" = whatever the add-on auto-updates to.
        esphome: ["2026.8.2", "latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome
          key: esphome-${{ matrix.esphome }}-${{ runner.os }}-v1

      - name: Install ESPHome ${{ matrix.esphome }}
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then pip install esphome; else pip install "esphome==${{ matrix.esphome }}"; fi
          esphome version

      - name: Write a CI stub that uses this checkout's modules
        run: |
          mkdir -p ci
          cat > ci/dravix-ci.yaml <<'EOF'
          wifi:
            ssid: "ci-network"
            password: "ci-password"
          packages:
            hardware: !include ../deploy/esphome/v2/hardware.yaml
            base: !include ../deploy/esphome/v2/base.yaml
            components: !include ../deploy/esphome/v2/components.yaml
            face: !include ../deploy/esphome/v2/face.yaml
            face_tick: !include ../deploy/esphome/v2/face_tick.yaml
            behavior: !include ../deploy/esphome/v2/behavior.yaml
            screens: !include ../deploy/esphome/v2/screens.yaml
            games: !include ../deploy/esphome/v2/games.yaml
          EOF

      - name: Validate
        run: |
          set -o pipefail
          esphome config ci/dravix-ci.yaml > validate.log 2>&1 || { grep -v "^ *$" validate.log | grep -A3 -E "Failed config|[A-Z][a-z][^:]*[.!]$" | head -10 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Compile
        run: |
          set -o pipefail
          esphome compile ci/dravix-ci.yaml 2>&1 | tee compile.log

      # job logs need a GitHub login to read; annotations don't, so the errors go there too
      - name: Compile errors as annotations
        if: failure()
        run: |
          [ -f compile.log ] || exit 0
          grep -E "error:|Error " compile.log | grep -v "^ *#" | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "^\S+\.(cpp|h):[0-9]+:[0-9]+:|In lambda|required from" compile.log | head -10 | while IFS= read -r l; do echo "::warning::$l"; done
