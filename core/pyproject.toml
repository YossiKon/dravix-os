[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dravix-os"
version = "0.1.3"
description = "Companion OS layer for the M5Stack StackChan robot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
    # upper-bounded: a breaking mcp 2.x could turn CI red (mcpserver is imported by tests)
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Cloud AI providers (only needed if DRAVIX_AI_PROVIDER is claude or openai).
providers = [
    "anthropic>=0.40",
    "openai>=1.30",
]

[project.scripts]
dravix = "dravix.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dravix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned ON PURPOSE. With no explicit selection ruff applies its own default set, and
# that set grows with each release: 0.16 added a batch of rules that turned CI red with
# no code change at all, which is exactly what an unpinned linter does to a published
# repository. This is the set the codebase is written against — widen it deliberately,
# never by upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
