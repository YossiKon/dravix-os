    # ── Page 6: ALERT IMAGE — a downloaded snapshot (Frigate person, doorbell, …) ──
    - id: page_image
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - image:
            id: img_show
            align: CENTER
            src: oi_show
    # ── DASHBOARD — a live screenshot of a Home Assistant dashboard (swipe slot 7, only in
    #    the cycle when a Dashboard URL is set). The image covers the hint once it loads;
    #    the hint reappears on a download error. Stays put until you swipe away (no timeout).
    - id: page_dash
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - label:
            id: dash_hint
            text: "Loading dashboard…"
            text_font: small_font
            text_color: 0x8b96a4
            align: CENTER
        - image:
            id: img_dash
            align: CENTER
            src: oi_dash
