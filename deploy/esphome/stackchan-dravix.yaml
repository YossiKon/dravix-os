    # ── CLIMATE — control the configured AC right on the robot (swipe slot 6). Every
    #    button fires esphome.dravix_climate {action}; dravix runs the HA service call
    #    on the AC you picked in the dashboard's Climate tab and writes the status back.
    - id: page_climate
      bg_color: 0x05080b
      bg_opa: COVER
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        # Mushroom header card: tinted climate-orange halo + dot, name + live info stacked
        # (the same card language as the 3 custom entity screens)
        - obj:
            id: clim_head
            x: 10
            y: 4
            width: 300
            height: 46
            radius: 14
            bg_color: 0x1c222c
            bg_opa: COVER
            border_width: 0
            scrollbar_mode: "OFF"
            widgets:
              - obj: { id: clim_halo, align: LEFT_MID, x: 8, width: 30, height: 30, radius: 15, bg_color: 0xFF7043, bg_opa: 25%, border_width: 0 }
              - obj: { id: clim_dot, align: LEFT_MID, x: 17, width: 12, height: 12, radius: 6, bg_color: 0xFF7043, bg_opa: COVER, border_width: 0 }
              - label: { id: lbl_clim_name, text: "AC", text_font: small_font, text_color: 0xF2F5F7, align: LEFT_MID, x: 46, y: -9 }
              - label: { id: lbl_clim_info, text: "", text_font: small_font, text_color: 0x8b96a4, align: LEFT_MID, x: 46, y: 10 }
        # big − / + for the target temperature, flanking a large readout
        - button:
            id: clim_minus
            x: 14
            y: 60
            width: 72
            height: 74
            radius: 18
            bg_color: 0x1c222c
            widgets:
              - label: { text: "-", text_font: big_font, text_color: 0x7bb0ff, align: CENTER }
            on_click:
              - homeassistant.event: { event: esphome.dravix_climate, data: { action: "temp_down" } }
        - label: { id: lbl_clim_set, text: "--°", text_font: big_font, text_color: 0xF2F5F7, align: TOP_MID, y: 78 }
        - button:
            id: clim_plus
            x: 234
            y: 60
            width: 72
            height: 74
            radius: 18
            bg_color: 0x1c222c
            widgets:
              - label: { text: "+", text_font: big_font, text_color: 0xff9440, align: CENTER }
            on_click:
              - homeassistant.event: { event: esphome.dravix_climate, data: { action: "temp_up" } }
        # HVAC mode PILLS — Mushroom accents; the ACTIVE mode gets a tinted fill + border
        # (lit by the 5s interval from the "mode|" prefix dravix sends in the info slot)
        - button: { id: clim_cool, x: 6,   y: 166, width: 58, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "COOL", text_font: small_font, text_color: 0x448AFF, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "cool" } } } ] }
        - button: { id: clim_heat, x: 68,  y: 166, width: 58, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "HEAT", text_font: small_font, text_color: 0xFF7043, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "heat" } } } ] }
        - button: { id: clim_fan,  x: 130, y: 166, width: 58, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "FAN", text_font: small_font, text_color: 0x26A69A, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "fan_only" } } } ] }
        - button: { id: clim_dry,  x: 192, y: 166, width: 58, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "DRY", text_font: small_font, text_color: 0xFFB300, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "dry" } } } ] }
        - button: { id: clim_auto, x: 254, y: 166, width: 58, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "AUTO", text_font: small_font, text_color: 0x66BB6A, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "auto" } } } ] }
        # power + fan-speed row (same pill language)
        - button: { id: clim_off,  x: 6,   y: 204, width: 120, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "OFF", text_font: small_font, text_color: 0xEF5350, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "off" } } } ] }
        - button: { id: clim_fanspd, x: 130, y: 204, width: 124, height: 32, radius: 16, bg_color: 0x1c222c, widgets: [ { label: { text: "FAN SPEED", text_font: small_font, text_color: 0x26A69A, align: CENTER } } ], on_click: [ { homeassistant.event: { event: esphome.dravix_climate, data: { action: "fan_cycle" } } } ] }
        - button:
            id: clim_back
            x: 258
            y: 204
            width: 54
            height: 32
            radius: 16
            bg_color: 0x05080b
            widgets:
              - label: { text: "<", text_font: text_font, text_color: 0x33E6C8, align: CENTER }
            on_click:
              - globals.set: { id: g_card, value: "0" }
              - lvgl.page.show: page_face

script:
  # ── COMPANION BEHAVIOURS (fw43) — the little things Emo / Eilik / Vector do ──
  - id: startle             # a loud noise: wide eyes, a quick glance toward it, then back to business
    mode: single
    then:
      - lambda: 'lv_disp_trig_activity(NULL);'
      - globals.set: { id: g_expr, value: "5" }          # wide, surprised
      - script.execute: render_face
      - if:
          condition: { lambda: 'return id(sw_move).state && !id(head_nudge).is_running();' }
          then: [ { script.execute: { id: head_nudge, dx: !lambda 'return random_float() < 0.5f ? -14 : 14;', dy: 4 } } ]
      - delay: 1300ms
      - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
      - script.execute: render_face
  - id: yawn                # bored: heavy lids, a big round mouth, a slow droop and a sleepy sound
    mode: single
    then:
      - if:
          condition: { lambda: 'return !id(g_sleep) && !id(g_saver) && !id(g_voice) && !id(g_yawn);' }
          then:
            - globals.set: { id: g_yawn, value: "true" }
            - script.execute: render_face
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "yawn:d=4,o=4,b=85:c,e,d,c" } ]
            - if:   # one owner per body part: only droop if nothing else is moving the head
                condition: { lambda: 'return id(sw_move).state && !id(head_nudge).is_running();' }
                then: [ { script.execute: { id: head_nudge, dx: 0, dy: -8 } } ]
            - delay: 1800ms
            - globals.set: { id: g_yawn, value: "false" }
            - script.execute: render_face
  - id: sneeze              # Emo catches a cold now and then: a scrunch, an "achoo", a shake
    mode: single
    then:
      - if:
          condition: { lambda: 'return !id(g_sleep) && !id(g_saver) && !id(g_voice) && !id(g_yawn);' }
          then:
            - globals.set: { id: g_expr, value: "3" }          # the scrunched-up face
            - script.execute: render_face
            - delay: 450ms
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "achoo:d=16,o=6,b=210:c7,p,g,c" } ]
            - script.execute: head_nod
            - script.execute: { id: led_flash, r: 60, g: 25, b: 100 }
            - delay: 900ms
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
            - script.execute: render_face
  - id: lift_react          # picked up / carried: startled wide eyes; upside-down: x-eyes + a squeak
    mode: restart
    then:
      - lambda: 'lv_disp_trig_activity(NULL);'
      - globals.set: { id: g_expr, value: !lambda 'return id(g_lift) == 2 ? 7 : 5;' }
      - script.execute: render_face
      - if:
          condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
          then:
            - if:
                condition: { lambda: 'return id(g_lift) == 2;' }
                then: [ { rtttl.play: "help:d=16,o=6,b=220:e,c,e,c,e" } ]
                else: [ { rtttl.play: "eep:d=32,o=6,b=220:e,e" } ]
      - script.execute: { id: led_flash, r: 100, g: 100, b: 100 }
  - id: lift_relief         # set back down: a little "phew" and the resting face
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
          then: [ { rtttl.play: "phew:d=8,o=5,b=140:e,c" } ]
      - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
      - script.execute: render_face
      - script.execute: { id: led_flash, r: 20, g: 100, b: 30 }
  - id: grumpy_pet          # a pet while it is still cross about being shaken: a huff, then it softens a notch
    mode: single
    then:
      - globals.set: { id: g_expr, value: "3" }
      - script.execute: render_face
      - if:
          condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
          then: [ { rtttl.play: "huff:d=16,o=5,b=180:g,e" } ]
      - script.execute: { id: led_flash, r: 100, g: 10, b: 10 }
      - script.execute: head_shake
      - delay: 1200ms
      - lambda: 'if (id(g_grump) > 0) id(g_grump) -= 1;'
      - if:
          condition: { lambda: 'return id(g_grump) < 2;' }
          then:
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
            - script.execute: render_face
  - id: timer_ring          # an Assist timer finished: three rings, a happy face, green — any touch stops it
    mode: restart
    then:
      - globals.set: { id: g_timer_on, value: "true" }
      - lambda: 'lv_disp_trig_activity(NULL);'
      - globals.set: { id: g_card, value: "0" }
      - lvgl.page.show: page_face
      - globals.set: { id: g_expr, value: "1" }
      - script.execute: render_face
      - repeat:
          count: 3
          then:
            - if:
                condition: { lambda: 'return id(g_timer_on);' }
                then:
                  - rtttl.play: "ring:d=16,o=6,b=180:c,e,g,c7,g,e,c,e,g,c7"
                  - script.execute: { id: led_flash, r: 20, g: 100, b: 30 }
                  - script.execute: head_nod
                  - delay: 1600ms
      - globals.set: { id: g_timer_on, value: "false" }
      - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
      - script.execute: render_face
  - id: render_cards
    # the 3 entity cards: titles + the 12 Mushroom rows. Called on entering a card page and every 5s WHILE one shows.
    then:
      - lvgl.label.update: { id: lbl_c1_title, text: !lambda 'return id(t_c1_title).state;' }
      - lvgl.label.update: { id: lbl_c2_title, text: !lambda 'return id(t_c2_title).state;' }
      - lvgl.label.update: { id: lbl_c3_title, text: !lambda 'return id(t_c3_title).state;' }
      # ── MUSHROOM CARD ROWS — one pass renders all 12 rows. dravix sends one line per
      #    entity: "[x,y|]K|name|state" — K picks the lovelace-mushroom accent colour,
      #    name/state fill the two stacked labels, "x,y|" places the row as a mini-card.
      #    Legacy bodies (plain "name  STATE" lines) still render — all text in line 1.
      - lambda: |-
          auto colour = [](char k) -> uint32_t {
            switch (k) {
              case 'l': return 0xFFB300;  // light on / triggered sensor - amber
              case 's': return 0x448AFF;  // switch family on - blue
              case 'c': return 0xAB47BC;  // cover open - purple
              case 'K': return 0xEF5350;  // lock OPEN - red, needs attention
              case 'k': return 0x66BB6A;  // lock locked - green
              case 't': return 0xFF7043;  // climate active - orange
              case 'm': return 0x5C6BC0;  // media playing - indigo
              case 'b': return 0x26A69A;  // script / scene / button - teal
              case 'o': return 0x555b66;  // off / idle - grey
              default:  return 0x4a90d9;  // 'n' sensors / info - blue
            }
          };
          auto row = [&](lv_obj_t* btn, lv_obj_t* tint, lv_obj_t* dot, lv_obj_t* nm, lv_obj_t* stt,
                         const std::string& body, int k, int defy) {
            size_t s = 0;
            for (int i = 0; i < k; i++) {
              size_t p = body.find(10, s);
              if (p == std::string::npos) { lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN); return; }
              s = p + 1;
            }
            size_t e = body.find(10, s);
            std::string line = body.substr(s, e == std::string::npos ? std::string::npos : e - s);
            if (line.empty()) { lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN); return; }
            lv_obj_clear_flag(btn, LV_OBJ_FLAG_HIDDEN);
            // optional free-position prefix "x,y|" (comma before the first bar = a position)
            size_t bar = line.find('|');
            size_t comma = line.find(',');
            if (bar != std::string::npos && comma != std::string::npos && comma < bar) {
              lv_obj_set_size(btn, 150, 48);
              lv_obj_set_pos(btn, atoi(line.substr(0, comma).c_str()),
                                  atoi(line.substr(comma + 1, bar - comma - 1).c_str()));
              line = line.substr(bar + 1);
            } else {
              lv_obj_set_size(btn, 300, 46);
              lv_obj_set_pos(btn, 10, defy);
            }
            // "K|name|state" (a legacy line without the key shows whole-line as the name)
            char key = 'n';
            std::string name = line, st = "";
            if (line.size() > 1 && line[1] == '|') {
              key = line[0];
              size_t b2 = line.find('|', 2);
              name = line.substr(2, b2 == std::string::npos ? std::string::npos : b2 - 2);
              if (b2 != std::string::npos) st = line.substr(b2 + 1);
            }
            lv_label_set_text(nm, name.c_str());
            lv_label_set_text(stt, st.c_str());
            uint32_t col = colour(key);
            lv_obj_set_style_bg_color(tint, lv_color_hex(col), 0);
            lv_obj_set_style_bg_color(dot, lv_color_hex(col), 0);
            lv_obj_set_style_bg_opa(tint, key == 'o' ? 28 : 64, 0);   // dimmer halo when off
          };
          std::string body1 = id(t_c1_body).state;
          std::string body2 = id(t_c2_body).state;
          std::string body3 = id(t_c3_body).state;
          row(id(c1_r0), id(chip_c1_r0), id(dot_c1_r0), id(lbl_c1_r0), id(st_c1_r0), body1, 0, 38);
          row(id(c1_r1), id(chip_c1_r1), id(dot_c1_r1), id(lbl_c1_r1), id(st_c1_r1), body1, 1, 88);
          row(id(c1_r2), id(chip_c1_r2), id(dot_c1_r2), id(lbl_c1_r2), id(st_c1_r2), body1, 2, 138);
          row(id(c1_r3), id(chip_c1_r3), id(dot_c1_r3), id(lbl_c1_r3), id(st_c1_r3), body1, 3, 188);
          row(id(c2_r0), id(chip_c2_r0), id(dot_c2_r0), id(lbl_c2_r0), id(st_c2_r0), body2, 0, 38);
          row(id(c2_r1), id(chip_c2_r1), id(dot_c2_r1), id(lbl_c2_r1), id(st_c2_r1), body2, 1, 88);
          row(id(c2_r2), id(chip_c2_r2), id(dot_c2_r2), id(lbl_c2_r2), id(st_c2_r2), body2, 2, 138);
          row(id(c2_r3), id(chip_c2_r3), id(dot_c2_r3), id(lbl_c2_r3), id(st_c2_r3), body2, 3, 188);
          row(id(c3_r0), id(chip_c3_r0), id(dot_c3_r0), id(lbl_c3_r0), id(st_c3_r0), body3, 0, 38);
          row(id(c3_r1), id(chip_c3_r1), id(dot_c3_r1), id(lbl_c3_r1), id(st_c3_r1), body3, 1, 88);
          row(id(c3_r2), id(chip_c3_r2), id(dot_c3_r2), id(lbl_c3_r2), id(st_c3_r2), body3, 2, 138);
          row(id(c3_r3), id(chip_c3_r3), id(dot_c3_r3), id(lbl_c3_r3), id(st_c3_r3), body3, 3, 188);
  - id: render_vitals
    # the 4 vitals bars. Called on entering the page and every 5s while it shows.
    then:
      # vitals bars (dravix pushes the 0-100 values into the number entities)
      - lvgl.bar.update: { id: bar_energy, value: !lambda 'return (int) id(n_vital_energy).state;' }
      - lvgl.bar.update: { id: bar_food,   value: !lambda 'return (int) id(n_vital_food).state;' }
      - lvgl.bar.update: { id: bar_fun,    value: !lambda 'return (int) id(n_vital_fun).state;' }
      - lvgl.bar.update: { id: bar_calm,   value: !lambda 'return (int) id(n_vital_calm).state;' }
  - id: render_climate
    # the climate page labels + mode pills. Called on entering the page and every 5s while it shows.
    then:
      # climate page — dravix keeps these slots fresh from the configured AC
      - lvgl.label.update: { id: lbl_clim_name, text: !lambda 'return id(t_clim_name).state.empty() ? std::string("No AC configured") : id(t_clim_name).state;' }
      - lvgl.label.update: { id: lbl_clim_set,  text: !lambda 'return id(t_clim_set).state;' }
      # info slot = "mode|display text" (add-on 0.0.90+): strip the mode for display and
      # light the ACTIVE mode pill Mushroom-style (tinted fill + border in its accent).
      - lambda: |-
          std::string raw = id(t_clim_info).state;
          std::string mode = "", info = raw;
          size_t bar = raw.find('|');
          if (bar != std::string::npos) { mode = raw.substr(0, bar); info = raw.substr(bar + 1); }
          lv_label_set_text(id(lbl_clim_info), info.c_str());
          auto pill = [&](lv_obj_t* b, const char* m, uint32_t col) {
            bool on = (mode == m) || (strcmp(m, "auto") == 0 && mode == "heat_cool");
            lv_obj_set_style_bg_color(b, on ? lv_color_hex(col) : lv_color_hex(0x1c222c), 0);
            lv_obj_set_style_bg_opa(b, on ? 64 : 255, 0);
            lv_obj_set_style_border_width(b, on ? 2 : 0, 0);
            lv_obj_set_style_border_color(b, lv_color_hex(col), 0);
          };
          pill(id(clim_cool), "cool", 0x448AFF);
          pill(id(clim_heat), "heat", 0xFF7043);
          pill(id(clim_fan),  "fan_only", 0x26A69A);
          pill(id(clim_dry),  "dry", 0xFFB300);
          pill(id(clim_auto), "auto", 0x66BB6A);
          pill(id(clim_off),  "off", 0xEF5350);
  # ── SENSOR HANDLERS — one body per signal, shared by BOTH prefix imports (see the
  #    sensor/text_sensor sections). Keeping the logic here instead of inline means the
  #    fresh-flash entity and the renamed-device entity can never drift apart.
  - id: touch_pet           # a pad was touched (or released) — pet, or approve a prompt
    parameters:
      v: string
    then:
      - if:
          condition:
            lambda: |-
              return v != "No touch" && v != "unknown" && v != "unavailable" && v != ""
                     && !id(g_pet) && id(sw_touch).state;
          then:
            - globals.set: { id: g_pet, value: "true" }
            - lambda: 'id(g_ia_ms) = (long) millis();'
            # While an Approve/Reject prompt is up, a HEAD TOUCH approves it (the red
            # on-screen button rejects). Otherwise it's a pet — unless it is still cross
            # about being shaken (Eilik-style): then it huffs, and each pet calms it a little.
            - if:
                condition: { lambda: 'return id(g_perm);' }
                then:
                  - script.execute: perm_approve
                else:
                  - if:
                      condition: { lambda: 'return id(g_grump) >= 2;' }
                      then: [ { script.execute: grumpy_pet } ]
                      else: [ { script.execute: pet_react } ]
      - if:
          condition: { lambda: 'return v == "No touch";' }            # released
          then:
            - globals.set: { id: g_pet, value: "false" }
  - id: touch_tickle        # the back of the head — a giggly wiggle rather than a calm pet
    parameters:
      v: string
    then:
      - if:
          condition:
            lambda: |-
              return v != "No touch" && v != "unknown" && v != "unavailable" && v != ""
                     && !id(g_pet) && id(sw_touch).state;
          then:
            - globals.set: { id: g_pet, value: "true" }
            - lambda: 'id(g_ia_ms) = (long) millis();'
            - script.execute: tickle
      - if:
          condition: { lambda: 'return v == "No touch";' }
          then:
            - globals.set: { id: g_pet, value: "false" }
  - id: prox_seen           # proximity counts — a boop, an approach, a wave, or a departure
    parameters:
      v: float
    then:
      # a finger right at the sensor = a BOOP — beloved ritual of every desk robot
      - if:
          condition: { lambda: 'return v > ${prox_boop} && !id(g_sleep) && !id(g_saver) && id(sw_touch).state;' }
          then: [ { script.execute: boop_react } ]
      # (boop excludes greet/wave — a finger straight to the sensor is a boop, not both)
      # PRESENCE is tracked UNCONDITIONALLY — g_near feeds the "Presence nearby" sensor
      # that dravix's wellness tips + HA automations rely on. Only the greet/wave
      # REACTIONS are gated by the "Greet on approach" toggle (turning greet off used
      # to silently kill presence detection entirely).
      - if:
          condition: { lambda: 'return v > ${prox_near} && v <= ${prox_boop} && !id(g_near);' }
          then:
            - globals.set: { id: g_near, value: "true" }
            - lambda: 'id(g_ia_ms) = (long) millis();'
            # WAVE 👋 — three near/far swings inside 4s = a hand waving (an approach is
            # ONE sustained rise; only fast oscillation reaches 3). Waving wins over greet.
            - lambda: |-
                long now = (long) millis();
                if (now - id(g_wv_ms) > 4000) { id(g_wv_cnt) = 1; id(g_wv_ms) = now; }
                else { id(g_wv_cnt)++; }
            - if:
                condition: { lambda: 'return id(sw_greet).state;' }
                then:
                  - if:
                      condition: { lambda: 'return id(g_wv_cnt) >= 3;' }
                      then:
                        - lambda: 'id(g_wv_cnt) = 0;'
                        - script.execute: wave_react
                      else:
                        - script.execute: greet
      - if:
          condition: { lambda: 'return v < ${prox_far};' }            # they moved away
          then:
            - globals.set: { id: g_near, value: "false" }
  - id: lux_seen            # room light — dark sends it to sleep, light wakes it again
    parameters:
      v: float
    then:
      - if:
          condition: { lambda: 'return v < ${lux_dark} && !id(g_sleep) && id(sw_dark).state;' }
          then:
            - select.set: { id: robot_mode, option: sleep }
      - if:
          condition: { lambda: 'return v > ${lux_bright} && id(g_sleep) && id(sw_dark).state;' }
          then:
            - select.set: { id: robot_mode, option: awake }
  # ── STATUS BAR — apply the current g_sbar stage. 0 = hidden · 1 = a compact 40px strip
  #    (wifi / time / date / battery only) · 2 = the full 150px panel (+ VOL/SCR/LED
  #    sliders, power line, LOCAL button, update arrow). Swipe down steps 0→1→2; swipe
  #    up closes from either stage. The swipe guards elsewhere key off the bar's HIDDEN
  #    flag, which this script maintains.
  - id: sbar_apply
    then:
      - lambda: |-
          lv_obj_t *bar = id(statusbar);
          if (id(g_sbar) <= 0) { lv_obj_add_flag(bar, LV_OBJ_FLAG_HIDDEN); return; }
          bool full = id(g_sbar) >= 2;
          lv_obj_set_height(bar, full ? 150 : 40);
          lv_obj_t *ext[] = { id(sb_vol_lbl), id(sl_vol), id(sb_scr_lbl), id(sl_scr),
                              id(sb_led_lbl), id(sl_led), id(sb_power), id(sb_local) };
          for (auto *w : ext) {
            if (full) lv_obj_clear_flag(w, LV_OBJ_FLAG_HIDDEN);
            else      lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_clear_flag(bar, LV_OBJ_FLAG_HIDDEN);
      # The update arrows are LINE widgets (LvLineType) — hide them via the LVGL action, NOT a
      # raw lv_obj_add_flag(id(...)), which ESPHome 2026.6.5 rejects for typed widgets. Force
      # them off whenever the bar isn't full (the 5s interval owns them while it IS full, and
      # only shows them when an update is waiting) so they can't linger after a full→compact step.
      - if:
          condition: { lambda: 'return id(g_sbar) < 2;' }
          then: [ { lvgl.widget.hide: upd_a1 }, { lvgl.widget.hide: upd_a2 } ]
  # ── FACE TAP dispatch — single tap = STOP everything · double tap = toggle the AI ──
  - id: panic_stop            # single tap: cut speech + dance + effects, LEDs off, clean face
    then:
      - voice_assistant.stop                    # stop listening / speaking mid-sentence
      - media_player.stop: va_media_player      # …and external TTS (dravix chat/notify) too
      # STOP means stop NOW — neither the wake-ack's fallback nor the end-of-reply settle
      # may wake up later and repaint the face we are about to clean (the settle would also
      # sit waiting on audio that this tap just killed)
      - script.stop: wake_ack
      - script.stop: voice_settle
      - script.stop: led_flash
      - script.stop: party                      # stop the disco / dance
      - script.stop: identify
      # …and EVERY other animation — "stop everything" used to leave a dance bopping with
      # rainbow LEDs (its own restore then overrode the turn-off below).
      - script.stop: dance
      - script.stop: eat
      - script.stop: drink
      - script.stop: tickle
      - script.stop: boop_react
      - script.stop: wave_react
      - script.stop: hand_react
      - script.stop: greet
      - script.stop: wave
      - script.stop: shy
      - script.stop: clap
      - script.stop: pet_react
      - script.stop: plug_react
      - script.stop: ir_glance
      - script.stop: dizzy_react
      - script.stop: yawn
      - script.stop: sneeze
      - script.stop: lift_react
      - script.stop: lift_relief
      - script.stop: grumpy_pet
      - script.stop: timer_ring
      - script.stop: startle
      - globals.set: { id: g_yawn, value: "false" }
      - globals.set: { id: g_timer_on, value: "false" }
      - script.stop: react_hot
      - script.stop: react_cold
      - script.stop: rub_eyes
      - script.stop: head_nudge
      - script.stop: head_shake
      - script.stop: head_nod
      - globals.set: { id: g_flash,  value: "false" }
      - globals.set: { id: g_listen, value: "false" }
      - globals.set: { id: g_think,  value: "false" }   # else STOP mid-"thinking" leaves the face + HA state stuck
      - globals.set: { id: g_talk,   value: "false" }
      - globals.set: { id: g_voice,  value: "false" }
      - globals.set: { id: g_sweat,  value: "false" }
      - globals.set: { id: g_conc,   value: "false" }
      - globals.set: { id: g_ext_talk, value: "false" }
      # a stopped eat/drink cleans up only at its END — tidy its props here
      - lvgl.widget.hide: hand_l
      - lvgl.widget.hide: hand_r
      - lvgl.widget.hide: food_item
      - lvgl.widget.hide: food_top
      - lvgl.widget.hide: heart1
      - lvgl.widget.hide: heart2
      - lvgl.widget.hide: heart3
      - lvgl.widget.hide: drink_glass
      - lvgl.widget.hide: drink_water
      - lvgl.widget.update: { id: hand_l, x: -34, y: 92 }   # paws back to their home spot
      - lvgl.widget.update: { id: hand_r, x: 34, y: 92 }
      - light.turn_on: { id: stackchan_light_bar, effect: "None" }   # cancel a running LED effect…
      - light.turn_off: stackchan_light_bar     # …then no LEDs — back to a clean state
      - script.execute: render_face             # redraw the current mode's face
  - id: tap_single            # settle timer: a settled DOUBLE (2 taps) toggles the AI; 1 tap = nothing
    mode: restart
    then:
      - delay: 380ms
      - if:
          condition: { lambda: 'return id(g_tapc) == 2;' }
          then:
            - if:
                condition: { lambda: 'return id(g_voice);' }
                then:
                  - voice_assistant.stop
                else:
                  - if:
                      condition: { switch.is_off: sw_privacy }
                      then: [ voice_assistant.start ]
      - globals.set: { id: g_tapc, value: "0" }
      - globals.set: { id: g_dc_ms, value: "0" }
  # After ~25s the alert image goes away and the face comes back.
  - id: img_timeout
    mode: restart
    then:
      - delay: 25s
      - if:
          condition: { lvgl.page.is_showing: page_image }
          then: [ { lvgl.page.show: page_face } ]
  # A wellness tip auto-hides after ~12s (the speech bubble goes back to the face).
  - id: tip_timeout
    mode: restart
    then:
      - delay: 12s
      - globals.set: { id: g_tip, value: "false" }
      - script.execute: render_face
  # NO-VOICE AUTO-CLOSE — armed on every listen (wake word / double-tap / follow-up turn).
  # If ${listen_timeout_s}s pass while STILL listening and VAD never heard a voice, close
  # the session (voice_assistant.stop → on_end cleans the face/LEDs + re-arms the wake
  # word). Once a voice IS detected (g_vad) this never cuts you off mid-sentence.
  - id: listen_timeout
    mode: restart
    then:
      - delay: ${listen_timeout_s}s
      - if:
          condition: { lambda: 'return id(g_listen) && !id(g_vad);' }
          then:
            - voice_assistant.stop
  # Safety auto-hide for the permission prompt — clears the buttons after 3 min if you never
  # tapped (the agent has already timed out by then). NEVER auto-decides — just tidies up.
  - id: perm_timeout
    mode: restart
    then:
      - delay: 180s
      - globals.set: { id: g_perm, value: "false" }
      - lvgl.widget.hide: perm_box
  # APPROVE via a head touch — fires the moment you touch (quick + reliable, no waiting for
  # release / no HA round-trip race). REJECT is screen-only (the red button on the prompt).
  # NOT while asleep/screensaver: petting a sleeping robot must never blind-approve an
  # agent request the user hasn't even seen.
  - id: perm_approve
    then:
      - if:
          condition: { lambda: 'return id(g_perm) && !id(g_sleep) && !id(g_saver);' }
          then:
            - globals.set: { id: g_perm, value: "false" }
            - lvgl.widget.hide: perm_box
            - homeassistant.event: { event: esphome.dravix_permission, data: { decision: "approve" } }
            - globals.set: { id: perm_dec, value: "1" }
            - script.execute: perm_log
            - script.execute: head_nod            # a "yes" nod to confirm
  # APPROVE from a face TAP — waits 200 ms first, so a tap on the red Reject button wins the race
  # (Reject flips g_perm off, and this then no-ops). Head-touch still approves instantly.
  - id: perm_tap_approve
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition: { lambda: 'return id(g_perm);' }
          then: [ { script.execute: perm_approve } ]
  # Set both eyes to a shape: width / height / corner-radius / vertical offset.
  # (Eyes are align:CENTER, so size changes keep them centred — no x math needed.)
  - id: set_eyes
    mode: restart
    parameters:
      w: int
      h: int
      r: int
      dy: int
    then:
      - lvgl.widget.update:
          id: eye_l
          width: !lambda 'return w;'
          height: !lambda 'return h;'
          radius: !lambda 'return r;'
          y: !lambda 'return dy;'
      - lvgl.widget.update:
          id: eye_r
          width: !lambda 'return w;'
          height: !lambda 'return h;'
          radius: !lambda 'return r;'
          y: !lambda 'return dy;'
  - id: set_mouth
    mode: restart
    parameters:
      w: int
      h: int
      r: int
      dy: int
    then:
      - lvgl.widget.update:
          id: mouth
          width: !lambda 'return w;'
          height: !lambda 'return h;'
          radius: !lambda 'return r;'
          y: !lambda 'return dy;'
  # ── BODY LANGUAGE ─────────────────────────────────────────────────────────────
  # Nudge the head relative to where it is now. PITCH goes through n_head_pitch, i.e.
  # in YOUR units (158..260, straight=165) — never the motor's internal 0..90 scale.
  # Writes are spaced 350ms apart — the SCS9009 serial bus drops back-to-back writes.
  # HARD no-move rule: in the calm modes (night / focus / quiet) body language is
  # fully OFF — not even slow moves (only deliberate user control still works).
  - id: head_nudge
    mode: restart
    parameters:
      dx: int
      dy: int
    then:
      - lambda: 'id(g_move_ms) = (long) millis();'   # a commanded move — not a hand
      - if:
          condition:
            lambda: |-
              return id(sw_move).state && dx != 0 && !std::isnan(id(servo_x_angle).state)
                     && !id(g_night) && !id(g_focus) && !id(g_quiet)
                     && !id(g_sleep) && !id(g_saver);
          then:
            - number.set:
                id: servo_x_angle
                value: !lambda |-
                  float v = id(servo_x_angle).state + dx;
                  return v < -164 ? -164 : (v > 164 ? 164 : v);
            - delay: 350ms
      - if:
          condition:
            lambda: |-
              return id(sw_move).state && dy != 0 && !std::isnan(id(n_head_pitch).state)
                     && !id(g_night) && !id(g_focus) && !id(g_quiet)
                     && !id(g_sleep) && !id(g_saver);
          then:
            - number.set:
                id: n_head_pitch
                value: !lambda |-
                  float v = id(n_head_pitch).state + dy;
                  return v < 158 ? 158 : (v > 260 ? 260 : v);
  # A quick left-right "no!" shake (angry / playful). Silent in the calm modes.
  # mode: single — the steps are RELATIVE (-12/+24/-12 sums to zero), so a restart
  # mid-sequence left the head permanently off-centre by ±12° per collision.
  - id: head_shake
    mode: single
    then:
      - lambda: 'id(g_move_ms) = (long) millis();'
      - if:
          condition:
            lambda: |-
              return id(sw_move).state && !std::isnan(id(servo_x_angle).state)
                     && !id(g_night) && !id(g_focus) && !id(g_quiet)
                     && !id(g_sleep) && !id(g_saver);
          then:
            - number.set:
                id: servo_x_angle
                value: !lambda 'float v = id(servo_x_angle).state - 12; return v < -164 ? -164 : v;'
            - delay: 350ms
            - number.set:
                id: servo_x_angle
                value: !lambda 'float v = id(servo_x_angle).state + 24; return v > 164 ? 164 : v;'
            - delay: 350ms
            - number.set:
                id: servo_x_angle
                value: !lambda 'float v = id(servo_x_angle).state - 12; return v < -164 ? -164 : v;'
  # A gentle up-down "yes" nod (agree / acknowledge / greet). PITCH via n_head_pitch
  # (158..260). Silent in the calm modes. mode: single — same drift-on-restart risk as head_shake.
  - id: head_nod
    mode: single
    then:
      - lambda: 'id(g_move_ms) = (long) millis();'
      - if:
          condition:
            lambda: |-
              return id(sw_move).state && !std::isnan(id(n_head_pitch).state)
                     && !id(g_night) && !id(g_focus) && !id(g_quiet)
                     && !id(g_sleep) && !id(g_saver);
          then:
            - number.set:
                id: n_head_pitch
                value: !lambda 'float v = id(n_head_pitch).state + 12; return v > 260 ? 260 : v;'
            - delay: 350ms
            - number.set:
                id: n_head_pitch
                value: !lambda 'float v = id(n_head_pitch).state - 24; return v < 158 ? 158 : v;'
            - delay: 350ms
            - number.set:
                id: n_head_pitch
                value: !lambda 'float v = id(n_head_pitch).state + 12; return v > 260 ? 260 : v;'
  # ── MOOD LEDs — flash an emotion colour for ~2.5s, then put the LEDs back ──────
  - id: led_flash
    mode: restart
    parameters:
      r: int
      g: int
      b: int
    then:
      - if:
          # calm modes (night / focus / quiet) and SLEEP/SAVER = no light shows
          condition:
            lambda: |-
              return id(sw_mood_led).state && !id(g_voice)
                     && !id(g_night) && !id(g_focus) && !id(g_quiet)
                     && !id(g_sleep) && !id(g_saver);
          then:
            - if:
                condition: { lambda: 'return !id(g_flash);' }   # don't re-save our own colour
                then:
                  - lambda: |-
                      auto v = id(stackchan_light_bar).current_values;
                      id(led_on)  = v.is_on();
                      id(led_bri) = v.get_brightness();
                      id(led_r)   = v.get_red();
                      id(led_g)   = v.get_green();
                      id(led_b)   = v.get_blue();
            - globals.set: { id: g_flash, value: "true" }
            - light.turn_on:
                id: stackchan_light_bar
                brightness: 70%
                red: !lambda 'return r / 100.0f;'
                green: !lambda 'return g / 100.0f;'
                blue: !lambda 'return b / 100.0f;'
            - delay: 2500ms
            # if a voice conversation started meanwhile, DON'T stomp its yellow —
            # the conversation's own on_end will restore the true original colour.
            - if:
                condition: { lambda: 'return !id(g_voice);' }
                then:
                  - script.execute: restore_leds
            - globals.set: { id: g_flash, value: "false" }
  # ── PETTING — wake up, blush, pink LEDs, nuzzle up + a happy wiggle ─────────────
  - id: pet_react
    mode: restart
    then:
      - if:
          condition: { lambda: 'return !id(g_sleep) && !id(g_saver);' }   # DND: in sleep/screensaver ONLY a screen tap or "Ok Nabu" wakes it
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            # a pet must NOT cancel night/focus/quiet (it used to flip them to awake —
            # backlight to full, mood LEDs re-armed). It still blushes, gently.
            - if:
                condition: { lambda: 'return !id(g_night) && !id(g_focus) && !id(g_quiet) && id(robot_mode).current_option() != std::string("awake");' }
                then: [ { select.set: { id: robot_mode, option: awake } } ]
            # AFFECTION STREAK — pets within 90s of each other escalate: 1-2 = the happy
            # blush · 3-4 = love-eyes + a purr · 5+ = it MELTS (floating hearts). The robot
            # visibly warms up to sustained affection, Cozmo-style.
            - lambda: |-
                long now = (long) millis();
                if (now - id(g_pets_ms) > 90000) id(g_pets_n) = 0;
                id(g_pets_n) += 1;
                id(g_pets_ms) = now;
            - globals.set: { id: g_expr, value: !lambda 'return id(g_pets_n) >= 3 ? 6 : 1;' }   # streak → ♥ eyes
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - script.execute: render_face
            - script.execute: { id: led_flash, r: 100, g: 25, b: 45 }   # pink
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night) && id(g_pets_n) < 3;' }
                then: [ { rtttl.play: "pet:d=16,o=6,b=200:c,e,g" } ]   # a happy little giggle 😊
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night) && id(g_pets_n) >= 3;' }
                then: [ { rtttl.play: "purr:d=16,o=5,b=140:c,e,c,e,g" } ]   # a longer, warmer purr
            - delay: 400ms
            - script.execute: { id: head_nudge, dx: 0, dy: 12 }         # nuzzle up into your hand
            - delay: 900ms
            - script.execute: head_shake                                # happy little wiggle
            - if:  # 5+ pets in a row → the melt: hearts float up over the blush
                condition: { lambda: 'return id(g_pets_n) >= 5;' }
                then:
                  - lvgl.widget.update: { id: heart1, y: 18 }
                  - lvgl.widget.update: { id: heart2, y: 26 }
                  - lvgl.widget.update: { id: heart3, y: 12 }
                  - lvgl.widget.show: heart1
                  - lvgl.widget.show: heart2
                  - lvgl.widget.show: heart3
                  - delay: 1600ms
                  - lvgl.widget.hide: heart1
                  - lvgl.widget.hide: heart2
                  - lvgl.widget.hide: heart3
  # ── EATS 🍪 — Ropet-style: paws lift a random treat to the mouth, 2 nibbles + "nom", then a
  #    happy "yum" nod. Fires from the Feed button, or spontaneously now and then on the face.
  - id: eat
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_voice) && !id(g_perm);' }
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - globals.set: { id: g_expr, value: "1" }
            - script.execute: render_face
            - lambda: 'id(g_food) = (int)(random_float() * 3.999f);'
            - lvgl.widget.update:
                id: food_item
                width:  !lambda 'return id(g_food) == 3 ? 40 : 30;'    # croissant is wider + flatter
                height: !lambda 'return id(g_food) == 3 ? 22 : 30;'
                radius: !lambda 'return id(g_food) == 1 ? 5 : (id(g_food) == 3 ? 11 : 15);'   # cake = slice
                bg_color: !lambda |-
                  switch (id(g_food)) {
                    case 0:  return lv_color_hex(0xc79457);   // cookie — golden tan
                    case 1:  return lv_color_hex(0xffc2d2);   // cake — pink frosting
                    case 2:  return lv_color_hex(0xe23b3b);   // apple — glossy red
                    default: return lv_color_hex(0xe6a94e);   // croissant — golden brown
                  }
            # a topping for EVERY treat: cookie chip · cake cherry · apple leaf · croissant fold
            - lvgl.widget.update:
                id: food_top
                bg_color: !lambda |-
                  switch (id(g_food)) {
                    case 0:  return lv_color_hex(0x5a3418);   // choc chip
                    case 1:  return lv_color_hex(0xff3355);   // cherry
                    case 2:  return lv_color_hex(0x4caf50);   // leaf
                    default: return lv_color_hex(0xb9791f);   // fold
                  }
            - lvgl.widget.show: food_top
            - lvgl.widget.update: { id: food_item, y: 86 }
            - lvgl.widget.update: { id: food_top, y: 72 }
            - lvgl.widget.update: { id: hand_l, y: 92 }
            - lvgl.widget.update: { id: hand_r, y: 92 }
            - lvgl.widget.show: hand_l
            - lvgl.widget.show: hand_r
            - lvgl.widget.show: food_item
            - delay: 260ms
            # lift to the mouth
            - lvgl.widget.update: { id: food_item, y: 66 }
            - lvgl.widget.update: { id: food_top, y: 52 }
            - lvgl.widget.update: { id: hand_l, y: 80 }
            - lvgl.widget.update: { id: hand_r, y: 80 }
            - lvgl.widget.update: { id: heart1, y: 46 }
            - lvgl.widget.update: { id: heart2, y: 52 }
            - lvgl.widget.update: { id: heart3, y: 40 }
            - lvgl.widget.show: heart1
            - lvgl.widget.show: heart2
            - lvgl.widget.show: heart3
            - delay: 340ms
            # nibble 1
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "nom:d=32,o=5,b=170:e" } ]
            - lvgl.widget.hide: food_top
            - lvgl.widget.update: { id: food_item, width: 20, height: 20 }
            - lvgl.widget.update: { id: heart1, y: 18 }
            - lvgl.widget.update: { id: heart2, y: 26 }
            - lvgl.widget.update: { id: heart3, y: 12 }
            - delay: 340ms
            # nibble 2
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "nom:d=32,o=5,b=170:c" } ]
            - lvgl.widget.update: { id: food_item, width: 10, height: 10 }
            - lvgl.widget.update: { id: heart1, y: -12 }
            - lvgl.widget.update: { id: heart2, y: -4 }
            - lvgl.widget.update: { id: heart3, y: -20 }
            - delay: 300ms
            # gone → yum!
            - lvgl.widget.hide: food_item
            - lvgl.widget.hide: heart1
            - lvgl.widget.hide: heart2
            - lvgl.widget.hide: heart3
            - globals.set: { id: g_expr, value: "1" }
            - script.execute: render_face
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "yum:d=16,o=6,b=160:c,e,g" } ]
            - script.execute: head_nod
            - delay: 220ms
            - lvgl.widget.hide: hand_l
            - lvgl.widget.hide: hand_r
  # ── DRINKS 🥤 — paws raise a glass of water to the mouth, 2 sips (the level drops), then "ahh".
  - id: drink
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_voice) && !id(g_perm);' }
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - globals.set: { id: g_expr, value: "1" }
            - script.execute: render_face
            - lvgl.widget.update: { id: drink_glass, y: 86 }
            - lvgl.widget.update: { id: drink_water, y: 96, height: 18 }
            - lvgl.widget.update: { id: hand_l, y: 92 }
            - lvgl.widget.update: { id: hand_r, y: 92 }
            - lvgl.widget.show: drink_glass
            - lvgl.widget.show: drink_water
            - lvgl.widget.show: hand_l
            - lvgl.widget.show: hand_r
            - delay: 260ms
            # raise to the mouth
            - lvgl.widget.update: { id: drink_glass, y: 62 }
            - lvgl.widget.update: { id: drink_water, y: 72, height: 14 }
            - lvgl.widget.update: { id: hand_l, y: 72 }
            - lvgl.widget.update: { id: hand_r, y: 72 }
            - delay: 320ms
            # sip 1
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "sip:d=16,o=4,b=150:c" } ]
            - lvgl.widget.update: { id: drink_water, y: 76, height: 8 }
            - delay: 360ms
            # sip 2
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "sip:d=16,o=4,b=150:c" } ]
            - lvgl.widget.update: { id: drink_water, y: 80, height: 2 }
            - delay: 320ms
            # empty → ahh
            - lvgl.widget.hide: drink_water
            - lvgl.widget.hide: drink_glass
            - globals.set: { id: g_expr, value: "1" }
            - script.execute: render_face
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "ahh:d=8,o=5,b=140:e,c" } ]
            - script.execute: head_nod
            - delay: 220ms
            - lvgl.widget.hide: hand_l
            - lvgl.widget.hide: hand_r
  # ── WAVE 👋 — a little paw rises by the face and wiggles hello (used by greet).
  - id: wave
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_perm);' }
          then:
            - lvgl.widget.update: { id: hand_r, x: 58, y: 8 }
            - lvgl.widget.show: hand_r
            - lvgl.widget.update: { id: hand_r, x: 44 }
            - delay: 150ms
            - lvgl.widget.update: { id: hand_r, x: 74 }
            - delay: 150ms
            - lvgl.widget.update: { id: hand_r, x: 44 }
            - delay: 150ms
            - lvgl.widget.update: { id: hand_r, x: 74 }
            - delay: 150ms
            - lvgl.widget.hide: hand_r
            - lvgl.widget.update: { id: hand_r, x: 34, y: 92 }   # back to its eating spot
  # ── RUBS EYES 😴 — both paws come up to the eyes and rub, sleepily (used when nodding off).
  - id: rub_eyes
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_perm);' }
          then:
            - lvgl.widget.update: { id: hand_l, x: -50, y: 2 }
            - lvgl.widget.update: { id: hand_r, x: 50, y: 2 }
            - lvgl.widget.show: hand_l
            - lvgl.widget.show: hand_r
            - lvgl.widget.update: { id: hand_l, y: -8 }
            - lvgl.widget.update: { id: hand_r, y: -8 }
            - delay: 190ms
            - lvgl.widget.update: { id: hand_l, y: 8 }
            - lvgl.widget.update: { id: hand_r, y: 8 }
            - delay: 190ms
            - lvgl.widget.update: { id: hand_l, y: -8 }
            - lvgl.widget.update: { id: hand_r, y: -8 }
            - delay: 190ms
            - lvgl.widget.update: { id: hand_l, y: 8 }
            - lvgl.widget.update: { id: hand_r, y: 8 }
            - delay: 190ms
            - lvgl.widget.hide: hand_l
            - lvgl.widget.hide: hand_r
            - lvgl.widget.update: { id: hand_l, x: -34, y: 92 }
            - lvgl.widget.update: { id: hand_r, x: 34, y: 92 }
  # ── SHY 🙈 — paws cover the eyes (blushing), then peek out (used on a boop, too close).
  - id: shy
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_perm);' }
          then:
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "shy:d=16,o=6,b=200:e,c" } ]
            - lvgl.widget.update: { id: hand_l, x: -54, y: 0 }
            - lvgl.widget.update: { id: hand_r, x: 54, y: 0 }
            - lvgl.widget.show: hand_l
            - lvgl.widget.show: hand_r
            - delay: 850ms
            - lvgl.widget.update: { id: hand_l, x: -72 }   # peek out
            - lvgl.widget.update: { id: hand_r, x: 72 }
            - delay: 550ms
            - lvgl.widget.hide: hand_l
            - lvgl.widget.hide: hand_r
            - lvgl.widget.update: { id: hand_l, x: -34, y: 92 }
            - lvgl.widget.update: { id: hand_r, x: 34, y: 92 }
  # ── CLAPS 👏 — paws clap together a few times (used when you win a game).
  - id: clap
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_perm);' }
          then:
            - lvgl.widget.update: { id: hand_l, x: -42, y: 42 }
            - lvgl.widget.update: { id: hand_r, x: 42, y: 42 }
            - lvgl.widget.show: hand_l
            - lvgl.widget.show: hand_r
            - lvgl.widget.update: { id: hand_l, x: -8 }
            - lvgl.widget.update: { id: hand_r, x: 8 }
            - delay: 120ms
            - lvgl.widget.update: { id: hand_l, x: -42 }
            - lvgl.widget.update: { id: hand_r, x: 42 }
            - delay: 120ms
            - lvgl.widget.update: { id: hand_l, x: -8 }
            - lvgl.widget.update: { id: hand_r, x: 8 }
            - delay: 120ms
            - lvgl.widget.update: { id: hand_l, x: -42 }
            - lvgl.widget.update: { id: hand_r, x: 42 }
            - delay: 120ms
            - lvgl.widget.hide: hand_l
            - lvgl.widget.hide: hand_r
            - lvgl.widget.update: { id: hand_l, x: -34, y: 92 }
            - lvgl.widget.update: { id: hand_r, x: 34, y: 92 }
  # ── PLUGGED IN 🔌 — "nom, electricity!": happy face + a green flash when the
  #    charger connects (silent while sleeping — the breathing LEDs take over there).
  - id: plug_react
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver);' }
          then:
            - globals.set: { id: g_expr, value: "1" }
            - script.execute: render_face
            - script.execute: { id: led_flash, r: 20, g: 100, b: 30 }
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "plug:d=16,o=5,b=200:c,g,c6" } ]   # "nom, electricity!" ⚡
            - delay: 2500ms
            # settle to the mood's RESTING face, not forced-neutral — this reaction never
            # trig_activity's, so the on_idle settle may already have fired and a mood face
            # set from HA would silently vanish until the next touch.
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
            - script.execute: render_face
      - delay: 30s   # a flaky charger connection can't turn this into a disco
  # ── WAVE 👋 — a hand waving at the sensor: wakes up, waves BACK with its head,
  #    happy face + warm flash. (Detected as 3 near/far proximity swings within 4s.)
  - id: wave_react
    mode: single
    then:
      - if:
          condition: { lambda: 'return !id(g_sleep) && !id(g_saver);' }   # DND: don't wake on a wave in sleep/screensaver
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - if:  # waving = you want its attention — but it must not cancel night/focus/quiet
                condition: { lambda: 'return !id(g_night) && !id(g_focus) && !id(g_quiet) && id(robot_mode).current_option() != std::string("awake");' }
                then: [ { select.set: { id: robot_mode, option: awake } } ]
            - globals.set: { id: g_expr, value: "1" }         # happy
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - script.execute: render_face
            - script.execute: { id: led_flash, r: 100, g: 60, b: 15 }   # warm hello
            - script.execute: head_shake                                 # waves back!
            - delay: 900ms
            - script.execute: head_shake
            - delay: 2000ms
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }   # back to the mood's resting face
            - script.execute: render_face
            - delay: 6s                                       # throttle
  # ── BOOP 👉 — a finger right up at the proximity sensor: love-eyes + a happy nod.
  - id: boop_react
    mode: single
    then:
      - lambda: 'lv_disp_trig_activity(NULL);'
      - globals.set: { id: g_expr, value: "6" }      # love ♥
      - globals.set: { id: g_card, value: "0" }
      - lvgl.page.show: page_face
      - script.execute: render_face
      - script.execute: { id: led_flash, r: 100, g: 20, b: 45 }
      - script.execute: head_nod
      - script.execute: shy                          # 🙈 bashful — covers its eyes
      - delay: 2500ms
      - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }   # back to the mood's resting face
      - script.execute: render_face
      - delay: 8s                                    # throttle boops
  # ── HAND-TURN REACTION — someone physically turned the head: a startled "hey!?",
  #    then it accepts the new pose (no fighting the hand) and settles happy.
  - id: hand_react
    mode: single
    then:
      - if:
          condition: { lambda: 'return !id(g_sleep) && !id(g_saver);' }   # DND: don't wake on a head-turn in sleep/screensaver
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - globals.set: { id: g_expr, value: "7" }      # dizzy x_x — whoa!
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - script.execute: render_face
            - script.execute: { id: led_flash, r: 60, g: 25, b: 100 }
            - delay: 1300ms
            - globals.set: { id: g_expr, value: "1" }      # ...okay, that was fun actually
            - script.execute: render_face
            - delay: 2000ms
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }   # back to the mood's resting face
            - script.execute: render_face
            - delay: 12s                                   # throttle: at most once per ~15s
  # ── SHAKEN! 😵 — the IMU felt real shaking: dizzy x_x eyes + "?", a woozy face wobble,
  #    violet LEDs and a warbly whimper. Being shaken wakes it (it's literally in your
  #    hands) but never cancels night/focus/quiet. One dizzy spell per shake session.
  - id: dizzy_react
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_voice) && !id(g_perm);' }
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - if:
                condition: { lambda: 'return (id(g_sleep) || id(g_saver)) && !id(g_night) && !id(g_focus) && !id(g_quiet);' }
                then: [ { select.set: { id: robot_mode, option: awake } } ]
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - globals.set: { id: g_expr, value: "7" }      # dizzy x_x + "?"
            - script.execute: render_face
            - script.execute: { id: led_flash, r: 55, g: 25, b: 100 }   # woozy violet
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night) && !id(g_sleep);' }
                then: [ { rtttl.play: "dizzy:d=16,o=5,b=170:g,e,c,e,g,e,c" } ]   # a wobbly whimper
            # the face wobbles like its inner gyro needs a second to settle
            - lvgl.widget.update: { id: face_box, x: -14 }
            - delay: 180ms
            - lvgl.widget.update: { id: face_box, x: 12 }
            - delay: 180ms
            - lvgl.widget.update: { id: face_box, x: -8 }
            - delay: 180ms
            - lvgl.widget.update: { id: face_box, x: 6 }
            - delay: 180ms
            - lvgl.widget.update: { id: face_box, x: 0 }
            - delay: 2400ms
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }   # back to the mood's resting face
            - script.execute: render_face
      - delay: 12s   # throttle — one dizzy spell per shake session
  # ── IR GLANCE — someone pressed a TV/AC remote: glance over, quizzical, then back.
  #    mode: single + the trailing delay = fires at most once per ~20s, and never
  #    interrupts sleep / screensaver / calm modes.
  - id: ir_glance
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(g_sleep) && !id(g_saver) && !id(g_night) && !id(g_focus)
                     && !id(g_quiet) && !id(g_voice) && id(sw_drift).state;
          then:
            - lambda: 'id(g_glance_ms) = (long) millis();'   # keep breathing off the glance
            - lvgl.widget.update: { id: face_box, x: 22, y: -4 }
            - globals.set: { id: g_expr, value: "5" }        # quizzical
            - script.execute: render_face
            - delay: 1600ms
            - lvgl.widget.update: { id: face_box, x: 0, y: 0 }
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }   # back to the mood's resting face
            - script.execute: render_face
      - delay: 20s
  # ── TICKLE (touch zone 3, back of the head) — giggly, faster than a calm pet ──
  - id: tickle
    mode: restart
    then:
      - if:
          condition: { lambda: 'return !id(g_sleep) && !id(g_saver);' }   # DND: don't wake on a tickle in sleep/screensaver
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - if:  # a tickle must not cancel night/focus/quiet either
                condition: { lambda: 'return !id(g_night) && !id(g_focus) && !id(g_quiet) && id(robot_mode).current_option() != std::string("awake");' }
                then: [ { select.set: { id: robot_mode, option: awake } } ]
            - globals.set: { id: g_expr, value: "1" }     # happy (cheeks show)
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - script.execute: render_face
            - script.execute: { id: led_flash, r: 20, g: 100, b: 60 }   # giggly green
            - script.execute: head_shake                                # wiggle!
            - delay: 900ms
            - script.execute: head_shake                                # ...and again
  # ── PARTY — a little disco: colour-cycling LEDs + head sways, then back to normal ──
  - id: party
    mode: restart
    then:
      - lambda: 'lv_disp_trig_activity(NULL);'
      - if:
          condition: { lambda: 'return id(robot_mode).current_option() != std::string("awake");' }
          then: [ { select.set: { id: robot_mode, option: awake } } ]
      - globals.set: { id: g_expr, value: "1" }
      - globals.set: { id: g_card, value: "0" }
      - lvgl.page.show: page_face
      - script.execute: render_face
      # remember the LEDs — guard on g_flash too, so a mid-flash colour isn't saved as "resting"
      - if:
          condition: { lambda: 'return !id(g_voice) && !id(g_flash);' }
          then:
            - lambda: |-
                auto v = id(stackchan_light_bar).current_values;
                id(led_on)  = v.is_on();
                id(led_bri) = v.get_brightness();
                id(led_r)   = v.get_red();
                id(led_g)   = v.get_green();
                id(led_b)   = v.get_blue();
      # the light bar has REAL animated effects built in (BSP) — run the rainbow
      # while the head sways, instead of hand-rolled colour flips
      - light.turn_on:
          id: stackchan_light_bar
          brightness: 100%
          effect: "Rainbow Effect With Custom Values"
      - repeat:
          count: 12
          then:
            - if:
                condition: { lambda: 'return id(sw_move).state && !std::isnan(id(servo_x_angle).state);' }
                then:
                  - number.set:
                      id: servo_x_angle
                      value: !lambda 'id(g_move_ms) = (long) millis(); id(g_pn)++; return (id(g_pn) % 2) ? 20.0f : -20.0f;'
            - delay: 620ms
      # settle: head back to centre, effect off, LEDs back to how they were
      - if:
          condition: { lambda: 'return id(sw_move).state;' }
          then:
            - number.set: { id: servo_x_angle, value: "0" }
      - light.turn_on: { id: stackchan_light_bar, effect: "None" }
      - if:
          condition: { lambda: 'return !id(g_voice);' }
          then:
            - script.execute: restore_leds
  # ── DANCE 💃 — bops its head + paws to a beat with rainbow LEDs (from HA / the dashboard).
  - id: dance
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_perm);' }
          then:
            - if:
                condition: { lambda: 'return id(robot_mode).current_option() != std::string("awake");' }
                then: [ { select.set: { id: robot_mode, option: awake } } ]
            - globals.set: { id: g_card, value: "0" }
            - globals.set: { id: g_expr, value: "1" }
            - lvgl.page.show: page_face
            - script.execute: render_face
            - lambda: 'lv_disp_trig_activity(NULL);'
            - if:
                condition: { lambda: 'return !id(g_voice) && !id(g_flash);' }
                then:
                  - lambda: |-
                      auto v = id(stackchan_light_bar).current_values;
                      id(led_on)  = v.is_on();
                      id(led_bri) = v.get_brightness();
                      id(led_r)   = v.get_red();
                      id(led_g)   = v.get_green();
                      id(led_b)   = v.get_blue();
            - light.turn_on: { id: stackchan_light_bar, brightness: 100%, effect: "Rainbow Effect With Custom Values" }
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "dance:d=8,o=5,b=150:c,e,g,c6,g,e,c" } ]
            - lvgl.widget.update: { id: hand_l, x: -52, y: 20 }
            - lvgl.widget.update: { id: hand_r, x: 52, y: 20 }
            - lvgl.widget.show: hand_l
            - lvgl.widget.show: hand_r
            - repeat:
                count: 5
                then:
                  - if:
                      condition: { lambda: 'return id(sw_move).state && !std::isnan(id(servo_x_angle).state);' }
                      then: [ { number.set: { id: servo_x_angle, value: "16" } } ]
                  - lvgl.widget.update: { id: hand_l, y: 6 }
                  - lvgl.widget.update: { id: hand_r, y: 36 }
                  - delay: 420ms
                  - if:
                      condition: { lambda: 'return id(sw_move).state && !std::isnan(id(servo_x_angle).state);' }
                      then: [ { number.set: { id: servo_x_angle, value: "-16" } } ]
                  - lvgl.widget.update: { id: hand_l, y: 36 }
                  - lvgl.widget.update: { id: hand_r, y: 6 }
                  - delay: 420ms
            - if:
                condition: { lambda: 'return id(sw_move).state;' }
                then: [ { number.set: { id: servo_x_angle, value: "0" } } ]
            - light.turn_on: { id: stackchan_light_bar, effect: "None" }
            - if:
                condition: { lambda: 'return !id(g_voice);' }
                then: [ { script.execute: restore_leds } ]
            - lvgl.widget.hide: hand_l
            - lvgl.widget.hide: hand_r
            - lvgl.widget.update: { id: hand_l, x: -34, y: 92 }
            - lvgl.widget.update: { id: hand_r, x: 34, y: 92 }
  # ── FEELS HOT 🥵 — wipes its brow, a sweat drop, a "phew".
  - id: react_hot
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_voice) && !id(g_perm);' }
          then:
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            # via g_sweat so render_face (blinks etc.) can't hide the drop mid-reaction
            - globals.set: { id: g_sweat, value: "true" }
            - lvgl.widget.show: sweat
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "hot:d=8,o=5,b=110:g,e,c" } ]
            - script.execute: { id: head_nudge, dx: 0, dy: -8 }   # wipes its brow
            - delay: 3500ms
            - globals.set: { id: g_sweat, value: "false" }
            - lvgl.widget.hide: sweat
  # ── FEELS COLD 🥶 — a shivery little shake + a "brr".
  - id: react_cold
    then:
      - if:
          condition: { lambda: 'return id(g_booted) && !id(g_sleep) && !id(g_saver) && !id(g_voice) && !id(g_perm);' }
          then:
            - globals.set: { id: g_card, value: "0" }
            - lvgl.page.show: page_face
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "brr:d=32,o=5,b=210:c,c,c,c,c" } ]
            - script.execute: head_shake
            - delay: 200ms
            - script.execute: head_shake
            - delay: 200ms
            - script.execute: head_shake
  # ── PERMISSIONS log — prepend the latest decision (OK/NO + the request) and refresh the page.
  - id: perm_log
    then:
      - lambda: |-
          id(perm_h2) = id(perm_h1);
          id(perm_h1) = id(perm_h0);
          id(perm_h0) = (id(perm_dec) == 1 ? std::string("OK   ") : std::string("NO   ")) + id(perm_cur);
      - lvgl.label.update: { id: pl_0, text: !lambda 'return id(perm_h0);' }
      - lvgl.label.update: { id: pl_1, text: !lambda 'return id(perm_h1);' }
      - lvgl.label.update: { id: pl_2, text: !lambda 'return id(perm_h2);' }
  # PUNCH — while wearing the boxing gloves, throw a quick right jab (glove darts in + back).
  - id: punch
    mode: single
    then:
      - if:
          condition: { lambda: 'return id(g_gloves);' }
          then:
            - lvgl.widget.update: { id: acc_gv_r,  x: 30, y: 4 }
            - lvgl.widget.update: { id: acc_gv_rc, x: 30, y: 24 }
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet) && !id(g_night);' }
                then: [ { rtttl.play: "pow:d=16,o=4,b=210:c,g" } ]
            - script.execute: { id: led_flash, r: 100, g: 15, b: 10 }
            - script.execute: { id: head_nudge, dx: 8, dy: 4 }
            - delay: 130ms
            - lvgl.widget.update: { id: acc_gv_r,  x: 74, y: 44 }
            - lvgl.widget.update: { id: acc_gv_rc, x: 74, y: 64 }
  # Redraw the pet face from the current state.
  - id: render_face
    then:
      # Background: awake = white OR the "Face background" theme · night/saver/sleep = black.
      # Painted ONLY when the colour actually changed — an LVGL style write invalidates the
      # full 320×240 even when the value is identical, and render_face runs on every blink.
      # (This also used to hard-code WHITE, stomping the theme select within seconds.)
      - if:
          condition:
            lambda: |-
              int c;
              if (id(g_sleep) || id(g_saver) || id(g_night)) c = 0x000000;
              else {
                auto s = id(sel_background).current_option();
                c = (s == "Space")  ? 0x0a1830
                  : (s == "Sunset") ? 0x6a3016
                  : (s == "Ocean")  ? 0x0d4a70
                  : (s == "Matrix") ? 0x0c3418
                  : (s == "Party")  ? 0x300a48
                  : (s == "Arena")  ? 0x5a1818
                  : 0xFFFFFF;
              }
              if (c == id(g_bg_last)) return false;
              id(g_bg_last) = c;
              return true;
          then:
            - lvgl.widget.update:
                id: bg_rect
                bg_color: !lambda 'return lv_color_hex(id(g_bg_last));'
      # stars belong to the "Space" theme — awake only (a sleeping face is dead-still black)
      - if:
          condition:
            lambda: |-
              return id(sel_background).current_option() == "Space"
                     && !id(g_sleep) && !id(g_saver) && !id(g_night);
          then:
            - lvgl.widget.show: bg_star1
            - lvgl.widget.show: bg_star2
            - lvgl.widget.show: bg_star3
            - lvgl.widget.show: bg_star4
            - lvgl.widget.show: bg_star5
            - lvgl.widget.show: bg_star6
          else:
            - lvgl.widget.hide: bg_star1
            - lvgl.widget.hide: bg_star2
            - lvgl.widget.hide: bg_star3
            - lvgl.widget.hide: bg_star4
            - lvgl.widget.hide: bg_star5
            - lvgl.widget.hide: bg_star6
      - lvgl.widget.update:
          id: eye_l
          bg_color: !lambda |-
            if (id(g_sleep) || id(g_saver)) return lv_color_hex(0x33E6C8);
            if (id(g_night)) return lv_color_hex(0x1f9e88);
            if (id(sel_background).current_option() != "None") return lv_color_hex(0xF2F5F7);  // light eyes on a dark theme
            return lv_color_hex(0x14181d);
      - lvgl.widget.update:
          id: eye_r
          bg_color: !lambda |-
            if (id(g_sleep) || id(g_saver)) return lv_color_hex(0x33E6C8);
            if (id(g_night)) return lv_color_hex(0x1f9e88);
            if (id(sel_background).current_option() != "None") return lv_color_hex(0xF2F5F7);
            return lv_color_hex(0x14181d);
      - lvgl.widget.update:
          id: mouth
          bg_color: !lambda |-
            if (id(g_sleep) || id(g_saver)) return lv_color_hex(0x33E6C8);
            if (id(g_night)) return lv_color_hex(0x1f9e88);
            if (id(sel_background).current_option() != "None") return lv_color_hex(0xF2F5F7);
            return lv_color_hex(0x14181d);
      # privacy + local badges (pills — show/hide the widget, an empty pill still draws)
      - if:
          condition: { lambda: 'return id(sw_privacy).state && !id(g_sleep);' }
          then: [ { lvgl.widget.show: lbl_priv } ]
          else: [ { lvgl.widget.hide: lbl_priv } ]
      - if:
          condition: { lambda: 'return id(sw_islocal).state && !id(g_sleep) && !id(g_saver);' }
          then: [ { lvgl.widget.show: lbl_local } ]
          else: [ { lvgl.widget.hide: lbl_local } ]
      # AI-agent badge — visible only when set AND the robot is awake (dead-still in sleep)
      - if:
          condition: { lambda: 'return id(g_agent) && !id(g_sleep) && !id(g_saver);' }
          then: [ { lvgl.widget.show: lbl_agent } ]
          else: [ { lvgl.widget.hide: lbl_agent } ]
      # speech bubble — while SPEAKING (the AI's words) or showing a wellness tip.
      # NOT while listening: listening is expressed by the FACE (big curious eyes,
      # attentive perk), never by an on-screen label. External speech shows a bubble
      # only when dravix put text in it (g_tip) — a random media stream that animates
      # the mouth (g_talk via the playback watcher) must not pop a STALE bubble.
      - if:
          condition: { lambda: 'return id(g_tip) || (id(g_talk) && id(g_voice));' }
          then:
            - lvgl.widget.show: speech_bubble
            - lvgl.widget.show: bub_t1
            - lvgl.widget.show: bub_t2
          else:
            - lvgl.widget.hide: speech_bubble
            - lvgl.widget.hide: bub_t1
            - lvgl.widget.hide: bub_t2
      # zzz drifts while sleeping
      - lvgl.label.update:
          id: lbl_zzz
          text: !lambda |-
            if (!id(g_sleep)) return std::string("");
            const char* z[] = {"z", "z z", "z z z", ""};
            return std::string(z[id(g_anim) % 4]);
      # pink cheeks on a happy or in-love idle face (and greet). Blinks DON'T hide them —
      # the cheeks sit below the eyes, and hiding them made the face flicker on every blink.
      - if:
          condition:
            lambda: |-
              return !id(g_sleep) && !id(g_listen) && !id(g_talk) && !id(g_think)
                     && !id(g_saver) && !id(g_focus) && !id(g_conc)
                     && (id(g_expr) == 1 || id(g_expr) == 6);
          then: [ { lvgl.widget.show: cheek_l }, { lvgl.widget.show: cheek_r } ]
          else: [ { lvgl.widget.hide: cheek_l }, { lvgl.widget.hide: cheek_r } ]
      - if:
          condition: { lambda: 'return id(g_sleep);' }
          then: [ { lvgl.widget.hide: mouth } ]
          else: [ { lvgl.widget.show: mouth } ]
      # ── eye + mouth shapes per state ──────────────────────────────────────────
      - if:  # sleeping → eyes closed
          condition: { lambda: 'return id(g_sleep);' }
          then:
            - script.execute: { id: set_eyes, w: 60, h: 10, r: 5, dy: 8 }
      - if:  # blink — always both eyes (winks were retired)
          condition: { lambda: 'return !id(g_sleep) && id(g_blink);' }
          then:
            - script.execute: { id: set_eyes, w: 64, h: 10, r: 5, dy: 0 }
      - if:  # listening → big curious eyes
          condition: { lambda: 'return !id(g_sleep) && !id(g_blink) && id(g_listen);' }
          then:
            - script.execute: { id: set_eyes, w: 74, h: 86, r: 28, dy: -2 }
            - script.execute: { id: set_mouth, w: 22, h: 8, r: 4, dy: 66 }
      - if:  # thinking → eyes drift up, pondering the reply (between your words and its answer)
          condition: { lambda: 'return !id(g_sleep) && !id(g_blink) && !id(g_listen) && id(g_think);' }
          then:
            - script.execute: { id: set_eyes, w: 56, h: 52, r: 22, dy: -14 }
            - script.execute: { id: set_mouth, w: 18, h: 6, r: 3, dy: 58 }
      - if:  # speaking → mouth opens and closes
          condition: { lambda: 'return !id(g_sleep) && !id(g_blink) && !id(g_listen) && id(g_talk);' }
          then:
            - script.execute: { id: set_eyes, w: 64, h: 58, r: 22, dy: 0 }
            - lvgl.widget.update:
                id: mouth
                width: 54
                radius: 12
                height: !lambda 'return (id(g_anim) % 2) ? 26 : 10;'
                y: 62
      - if:  # SCREENSAVER → slow dozy "breathing" eyes (they half-close and open)
          condition: { lambda: 'return !id(g_sleep) && !id(g_blink) && !id(g_listen) && !id(g_talk) && !id(g_think) && id(g_saver);' }
          then:
            - lvgl.widget.update:
                id: eye_l
                width: 60
                radius: 18
                y: 4
                height: !lambda 'const int b[] = {46, 38, 30, 38}; return b[id(g_anim) % 4];'
            - lvgl.widget.update:
                id: eye_r
                width: 60
                radius: 18
                y: 4
                height: !lambda 'const int b[] = {46, 38, 30, 38}; return b[id(g_anim) % 4];'
            - script.execute: { id: set_mouth, w: 30, h: 6, r: 3, dy: 66 }
      - if:  # FOCUS mode — or an external "focused" hint (a coding agent working) → steady, narrowed concentrating eyes
          condition: { lambda: 'return !id(g_sleep) && !id(g_blink) && !id(g_listen) && !id(g_talk) && !id(g_think) && !id(g_saver) && (id(g_focus) || id(g_conc));' }
          then:
            - script.execute: { id: set_eyes, w: 58, h: 40, r: 16, dy: 0 }
            - script.execute: { id: set_mouth, w: 28, h: 6, r: 3, dy: 64 }
      - if:  # YAWN — heavy lids and a big round mouth, for as long as g_yawn holds
          condition: { lambda: 'return !id(g_sleep) && id(g_yawn);' }
          then:
            - script.execute: { id: set_eyes, w: 64, h: 12, r: 6, dy: 8 }
            - script.execute: { id: set_mouth, w: 30, h: 30, r: 15, dy: 60 }
      - if:  # idle → the chosen expression
          condition: { lambda: 'return !id(g_sleep) && !id(g_blink) && !id(g_listen) && !id(g_talk) && !id(g_think) && !id(g_saver) && !id(g_focus) && !id(g_conc) && !id(g_yawn);' }
          then:
            - if:  # neutral
                condition: { lambda: 'return id(g_expr) == 0;' }
                then:
                  - script.execute: { id: set_eyes, w: 64, h: 64, r: 22, dy: 0 }
                  - script.execute: { id: set_mouth, w: 40, h: 8, r: 4, dy: 64 }
            - if:  # happy — squinted "^^" eyes, wide smile, cheeks
                condition: { lambda: 'return id(g_expr) == 1;' }
                then:
                  - script.execute: { id: set_eyes, w: 70, h: 26, r: 13, dy: -6 }
                  - script.execute: { id: set_mouth, w: 86, h: 10, r: 5, dy: 58 }
            - if:  # sad — droopy small eyes, tiny low mouth
                condition: { lambda: 'return id(g_expr) == 2;' }
                then:
                  - script.execute: { id: set_eyes, w: 52, h: 38, r: 15, dy: 10 }
                  - script.execute: { id: set_mouth, w: 26, h: 8, r: 4, dy: 70 }
            - if:  # angry — narrowed sharp eyes
                condition: { lambda: 'return id(g_expr) == 3;' }
                then:
                  - script.execute: { id: set_eyes, w: 70, h: 22, r: 7, dy: -2 }
                  - script.execute: { id: set_mouth, w: 48, h: 8, r: 4, dy: 64 }
            - if:  # sleepy — heavy lids
                condition: { lambda: 'return id(g_expr) == 4;' }
                then:
                  - script.execute: { id: set_eyes, w: 64, h: 14, r: 7, dy: 8 }
                  - script.execute: { id: set_mouth, w: 34, h: 8, r: 4, dy: 66 }
            - if:  # doubt — one raised eye, one squinted (asymmetric!)
                condition: { lambda: 'return id(g_expr) == 5;' }
                then:
                  - script.execute: { id: set_eyes, w: 64, h: 64, r: 22, dy: 0 }
                  - lvgl.widget.update: { id: eye_r, height: 30, y: 6 }
                  - script.execute: { id: set_mouth, w: 30, h: 8, r: 4, dy: 66 }
            - if:  # LOVE — big soft PINK eyes, blushing cheeks, wide smile
                condition: { lambda: 'return id(g_expr) == 6;' }
                then:
                  - script.execute: { id: set_eyes, w: 72, h: 66, r: 30, dy: -2 }
                  - lvgl.widget.update: { id: eye_l, bg_color: 0xFF5C8A }
                  - lvgl.widget.update: { id: eye_r, bg_color: 0xFF5C8A }
                  - script.execute: { id: set_mouth, w: 80, h: 10, r: 5, dy: 58 }
            - if:  # DIZZY — the eyes become little x-es (just been spun around)
                condition: { lambda: 'return id(g_expr) == 7;' }
                then:
                  - script.execute: { id: set_eyes, w: 8, h: 8, r: 4, dy: 0 }   # eyes shrink away
                  - script.execute: { id: set_mouth, w: 22, h: 8, r: 4, dy: 68 }
      # ── decorators (original-avatar style): x-eyes on dizzy + react_hot's sweat drop.
      #    Shown only on an idle face; hidden in every other state so they never linger.
      - if:  # CONFUSED / dizzy — x-eyes + a "?" above the head (only on an idle face).
             # Colours follow the background: dark marks on the white awake face, bright
             # teal/yellow on dark themes/night — teal-on-white was near-invisible (~1.8:1).
             # Blinks don't hide them: x-eyes don't blink (the blink itself skips expr 7).
          condition:
            lambda: |-
              return !id(g_sleep) && !id(g_listen) && !id(g_talk)
                     && !id(g_saver) && !id(g_focus) && !id(g_conc) && id(g_expr) == 7;
          then:
            - lvgl.label.update:
                id: dz_l
                text_color: !lambda |-
                  bool dark_bg = id(g_night) || id(sel_background).current_option() != "None";
                  return lv_color_hex(dark_bg ? 0x33E6C8 : 0x14181d);
            - lvgl.label.update:
                id: dz_r
                text_color: !lambda |-
                  bool dark_bg = id(g_night) || id(sel_background).current_option() != "None";
                  return lv_color_hex(dark_bg ? 0x33E6C8 : 0x14181d);
            - lvgl.label.update:
                id: q_mark
                text_color: !lambda |-
                  bool dark_bg = id(g_night) || id(sel_background).current_option() != "None";
                  return lv_color_hex(dark_bg ? 0xffd54a : 0xB5471F);
            - lvgl.widget.show: dz_l
            - lvgl.widget.show: dz_r
            - lvgl.widget.show: q_mark
          else: [ { lvgl.widget.hide: dz_l }, { lvgl.widget.hide: dz_r }, { lvgl.widget.hide: q_mark } ]
      - if:  # sweat drop — owned by react_hot (g_sweat), so a blink can't wipe it mid-reaction
          condition: { lambda: 'return id(g_sweat) && !id(g_sleep) && !id(g_saver);' }
          then: [ { lvgl.widget.show: sweat } ]
          else: [ { lvgl.widget.hide: sweat } ]
      # Publish the live state to HA (only when it actually changed).
      - lambda: |-
          std::string s = id(g_sleep)  ? "sleep"
                        : id(g_listen) ? "listening"
                        : id(g_think)  ? "thinking"
                        : id(g_talk)   ? "speaking"
                        : id(g_saver)  ? "screensaver"
                        : id(g_night)  ? "night"
                        : id(g_focus)  ? "focus"
                        : id(g_quiet)  ? "quiet"
                        : id(g_busy)   ? "busy" : "awake";
          if (!id(st_state).has_state() || id(st_state).state != s) id(st_state).publish_state(s);
  # Show the current "home screen" (0 = face, 1..3 = cards, 4 = the game).
  - id: show_card
    then:
      - if: { condition: { lambda: 'return id(g_card) == 1;' }, then: [ { lvgl.page.show: page_card1 }, { script.execute: render_cards } ] }
      - if: { condition: { lambda: 'return id(g_card) == 2;' }, then: [ { lvgl.page.show: page_card2 }, { script.execute: render_cards } ] }
      - if: { condition: { lambda: 'return id(g_card) == 3;' }, then: [ { lvgl.page.show: page_card3 }, { script.execute: render_cards } ] }
      - if: { condition: { lambda: 'return id(g_card) == 4;' }, then: [ { lvgl.page.show: page_vitals }, { script.execute: render_vitals } ] }
      - if: { condition: { lambda: 'return id(g_card) == 5;' }, then: [ { lvgl.page.show: page_climate }, { script.execute: render_climate } ] }
      # slot 6 — the 🌐 dashboard (only reachable when a Dashboard URL is set; the swipe
      # handlers use a modulus of 7 then, 6 otherwise, so this stays skipped when empty)
      - if: { condition: { lambda: 'return id(g_card) == 6;' }, then: [ { lvgl.page.show: page_dash }, { script.execute: dash_enter } ] }
      - if: { condition: { lambda: 'return id(g_card) <= 0 || id(g_card) > 6;' }, then: [ { lvgl.page.show: page_face } ] }
  # Entering the 🌐 dashboard page: pull a fresh screenshot right away, then keep it refreshed.
  - id: dash_enter
    then:
      - if:
          condition: { lambda: 'return !id(t_dash_url).state.empty();' }
          then:
            - online_image.set_url: { id: oi_dash, url: !lambda 'return id(t_dash_url).state;' }
      - script.execute: dash_refresh
  # Re-pull the dashboard screenshot every 15s WHILE the page is showing (and not dimmed by
  # the screensaver). Exits on its own once you swipe away — mode:restart so a re-entry can't
  # stack two loops.
  - id: dash_refresh
    mode: restart
    then:
      - while:
          condition:
            and:
              - lvgl.page.is_showing: page_dash
              - lambda: 'return !id(t_dash_url).state.empty();'
          then:
            - delay: 15s
            - if:
                condition:
                  and:
                    - lvgl.page.is_showing: page_dash
                    # skip the fetch+PNG-decode while dimmed (saver) OR asleep — the robot can
                    # idle→sleep with the 🌐 page still up (on_idle doesn't return it to the face),
                    # and re-downloading all night defeats the "dead-still asleep" contract. The
                    # loop stays alive (cheap 15s ticks) so it resumes the moment you wake it here.
                    - lambda: 'return !id(g_saver) && !id(g_sleep) && !id(t_dash_url).state.empty();'
                then:
                  - online_image.set_url: { id: oi_dash, url: !lambda 'return id(t_dash_url).state;' }
  # Greet: someone approached → wake up + a happy face + perk the head up.
  # (Skipped at night / in focus — do-not-disturb — AND while asleep/screensaver: the sleep
  # contract is "only a tap or the wake word wakes it", not someone walking past at night.)
  - id: greet
    then:
      - if:
          condition: { lambda: 'return !id(g_night) && !id(g_focus) && !id(g_sleep) && !id(g_saver);' }
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'   # reset the screensaver/sleep idle timer
            - globals.set: { id: g_card,  value: "0" }
            - globals.set: { id: g_expr,  value: "1" }     # happy
            - lvgl.page.show: page_face
            - if:
                condition: { lambda: 'return id(robot_mode).current_option() != std::string("awake");' }
                then: [ { select.set: { id: robot_mode, option: awake } } ]
            - script.execute: wave                                # 👋 a paw waves hello
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_quiet);' }
                then: [ { rtttl.play: "hi:d=16,o=6,b=180:e,g,c7" } ]   # a friendly "hello!" 👋
            - delay: 400ms
            - script.execute: { id: head_nudge, dx: 0, dy: 8 }   # perks up at you
            - delay: 500ms
            - script.execute: head_nod                            # …and nods hello 👋
  # Identify: flash the LEDs cyan 3× + a happy face, so you can find/confirm the robot.
  - id: identify
    then:
      - if:
          condition: { lambda: 'return !id(g_voice) && !id(g_flash);' }
          then:
            - lambda: |-
                auto v = id(stackchan_light_bar).current_values;
                id(led_on)  = v.is_on();
                id(led_bri) = v.get_brightness();
                id(led_r)   = v.get_red();
                id(led_g)   = v.get_green();
                id(led_b)   = v.get_blue();
      - globals.set: { id: g_expr, value: "1" }
      - script.execute: render_face
      - repeat:
          count: 3
          then:
            - light.turn_on: { id: stackchan_light_bar, brightness: 100%, red: 0%, green: 90%, blue: 100% }
            - delay: 250ms
            - light.turn_off: stackchan_light_bar
            - delay: 200ms
      - if:
          condition: { lambda: 'return !id(g_voice);' }
          then:
            - script.execute: restore_leds
  # AI-mode LEDs: go YELLOW (gated by the "Speaking LEDs" switch).
  # ── VOICE-TURN LEDS — one colour per stage, so the light bar alone tells you where the
  #    conversation is: CYAN = listening to you · AMBER = thinking · GREEN = talking back.
  #    (It used to hold a single yellow for the whole turn; the per-stage colours are the
  #    "feedback for every state" ask.) Off switch: "Speaking LEDs" in HA / the dashboard.
  - id: leds_voice
    parameters:
      r: int
      g: int
      b: int
    then:
      - if:
          condition: { lambda: 'return id(sw_speak_led).state;' }
          then:
            - light.turn_on:
                id: stackchan_light_bar
                brightness: 80%
                red: !lambda 'return r / 100.0f;'
                green: !lambda 'return g / 100.0f;'
                blue: !lambda 'return b / 100.0f;'
  # ── "THAT DIDN'T WORK" — a voice turn that fails must LOOK different from one that
  #    succeeds. Both used to end by quietly restoring the face and the lights, so a
  #    missing Assist pipeline was indistinguishable from a normal, quiet finish.
  - id: va_error_show
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(g_sleep) && !id(g_saver) && !id(g_voice);'
          then:
            - lambda: 'lv_disp_trig_activity(NULL);'
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_night) && !id(g_quiet);' }
                then: [ { rtttl.play: "err:d=8,o=5,b=140:e,c" } ]   # a short "nope" down-beep
            - script.execute: { id: led_flash, r: 100, g: 30, b: 0 }   # amber, self-reverting
            - globals.set: { id: g_expr, value: "5" }                  # the quizzical face
            - script.execute: render_face
            - script.execute: head_shake                               # a little "no"
            - delay: 2500ms
            - globals.set: { id: g_expr, value: !lambda 'return id(g_face_rest);' }
            - script.execute: render_face
  # ── "I HEARD THE WAKE WORD" — the one piece of voice feedback that is entirely ON-DEVICE.
  #    Runs the instant micro_wake_word fires, before Home Assistant is involved at all, so
  #    you always know the robot's ear works even when the pipeline behind it doesn't.
  - id: wake_ack
    mode: restart
    then:
      - if:
          # never while privacy is on, and never mid-conversation — a tap-to-talk session
          # leaves the ear armed, and the wake word firing inside it must not ding again
          condition:
            all:
              - switch.is_off: sw_privacy
              - lambda: 'return !id(g_voice);'
          then:
            - lambda: 'lv_disp_trig_activity(NULL); id(g_ia_ms) = (long) millis();'   # heard = activity → no screensaver
            - if:
                condition: { lambda: 'return id(sw_sfx).state && !id(g_night) && !id(g_quiet);' }
                then: [ { rtttl.play: "nabu:d=16,o=6,b=210:e,b" } ]   # a short "mm-hm?" ding
            # a quick WHITE blink. led_flash is used on purpose: it saves the TRUE original
            # colour and restores it by itself after 2.5s, so a wake word that Home Assistant
            # never answers can never leave the bar lit. (It obeys "Mood LEDs" and stays dark
            # in night/focus/quiet/sleep — in those the ding alone is the acknowledgement.)
            - script.execute: { id: led_flash, r: 100, g: 100, b: 100 }
            # eyes wide, listening — the face reacts NOW instead of waiting for HA. No head
            # nudge here: on_listening owns the head for this turn (one owner per body part).
            - globals.set: { id: g_listen, value: "true" }
            - script.execute: render_face
            # SAFETY NET — if Home Assistant never opens a session (no pipeline assigned, HA
            # down, no network), nothing else would ever clear this face or switch the ear
            # back on, because micro_wake_word stops itself the moment it detects.
            - delay: 4s
            - if:
                condition: { lambda: 'return !id(g_voice);' }
                then:
                  - globals.set: { id: g_listen, value: "false" }
                  - script.execute: render_face
                  - if:
                      condition: { switch.is_off: sw_privacy }
                      then: [ micro_wake_word.start ]
  # ── END OF A VOICE TURN, FOR REAL. Home Assistant's on_end fires when the PIPELINE ends,
  #    which is when the reply's audio URL is handed over — seconds before the robot has
  #    finished saying it. Restoring there cut the talking face off mid-sentence. This waits
  #    for the sound itself to stop, then puts the face, the LEDs and the ear back.
  - id: voice_settle
    mode: restart
    then:
      - if:
          condition: { lambda: 'return id(g_talk);' }
          then:
            # …the URL still has to be fetched from Home Assistant over WiFi before a single
            # sample comes out, which is routinely a second or three. Wait for audio to START.
            - wait_until:
                condition: { lambda: 'return id(i2s_speaker).is_running();' }
                timeout: 5s
            - if:
                # The reply is playing: the speaker itself is the exact "sound is coming out
                # right now" signal, so wait for it to fall silent. `va.is_running()` rides
                # along as the escape hatch — the voice_assistant state machine only leaves
                # STREAMING_RESPONSE once the media player reports the announcement finished,
                # so a speaker flag that ever sticks ON can't freeze the face for a minute.
                condition: { lambda: 'return id(i2s_speaker).is_running();' }
                then:
                  - wait_until:
                      condition:
                        lambda: 'return !id(i2s_speaker).is_running() || !id(va).is_running();'
                      timeout: 60s
                  # a short gap inside the reply is not the end of it — look again after a beat
                  - delay: 300ms
                  - wait_until:
                      condition:
                        lambda: 'return !id(i2s_speaker).is_running() || !id(va).is_running();'
                      timeout: 30s
                else:
                  # Nothing audible after 5s. Do NOT assume it's over — a slow fetch would
                  # otherwise restore the face just as the robot starts speaking, which is the
                  # very bug this script exists to fix. Let the state machine call it instead.
                  - wait_until:
                      condition: { lambda: 'return !id(va).is_running();' }
                      timeout: 60s
      - globals.set: { id: g_listen, value: "false" }
      - globals.set: { id: g_think,  value: "false" }
      - globals.set: { id: g_talk,   value: "false" }
      - globals.set: { id: g_voice,  value: "false" }
      - script.execute: render_face      # back to the resting face it had before the turn
      - script.execute: restore_leds     # …and the LEDs it had before the turn (or off)
      - if:
          condition: { switch.is_off: sw_privacy }
          then: [ micro_wake_word.start ]
  # Put the LEDs back to whatever they were before the voice interaction (or off).
  - id: restore_leds
    then:
      - if:
          condition: { lambda: 'return id(led_on);' }
          then:
            - light.turn_on:
                id: stackchan_light_bar
                brightness: !lambda 'return id(led_bri);'
                red: !lambda 'return id(led_r);'
                green: !lambda 'return id(led_g);'
                blue: !lambda 'return id(led_b);'
          else:
            - light.turn_off: stackchan_light_bar
