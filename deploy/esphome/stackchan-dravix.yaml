# ════════════════════════════════════════════════════════════════════════════════
#  Dravix · the firmware entry
#
#  Every robot's device file in the ESPHome add-on (template: deploy/esphome/stackchan.yaml)
#  pulls THIS file from GitHub when you press Install, and this file brings in the modules.
#  The device file never changes when the firmware grows: updating = pressing Install.
#  Never move or rename this file: every robot out there points at this exact path.
# ════════════════════════════════════════════════════════════════════════════════
packages:
  hardware: !include v2/hardware.yaml        # the StackChan itself: M5Stack's BSP, vendored
  base: !include v2/base.yaml                # Assist voice, sound, diagnostics, the green dot
  components: !include v2/components.yaml    # where every driver comes from (pinned)
  face: !include v2/face.yaml                # the face page and its state machine
  face_tick: !include v2/face_tick.yaml      # the 30 fps face animation and the LED bar
  behavior: !include v2/behavior.yaml        # touch, shake, lift, people, light, night, sleep
  screens: !include v2/screens.yaml          # Screen 1, Screen 2 and the air conditioner
  games: !include v2/games.yaml              # the Games screen and the camera games
  modes: !include v2/modes.yaml              # Normal / Busy / Sleep, the menu, the clock, the status bar
