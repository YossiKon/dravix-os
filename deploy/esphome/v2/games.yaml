# ════════════════════════════════════════════════════════════════════════════════
#  Dravix v2 · games — played on the robot itself: the screen, or the three head pads.
#  Swipe to the "Games" screen (or HA: Screen → Games, or the play_game action).
#  1 rock paper scissors · 2 coin · 3 dice · 4 magic 8-ball · 5 reaction
#  While a game runs, the pads are game buttons (pad 1/2/3), and petting, shaking and
#  "hello" reactions stay quiet. The wake word and a ringing timer end a game.
# ════════════════════════════════════════════════════════════════════════════════
esphome:
  includes: ["<img_converters.h>"]     # the camera library's JPEG decoder (jpg2rgb565)

globals:
  - { id: g_eye_rgb,     type: uint32_t, restore_value: no,  initial_value: "0x5EF0E2" }   # Chameleon: the eye colour…
  - { id: g_eye_until,   type: uint32_t, restore_value: no,  initial_value: "0" }          # …until
  - { id: g_cam_purpose, type: int,      restore_value: no,  initial_value: "0" }          # a frame asked for: 1 chameleon 2 photo 3 guard 4 mirror 5 follow
  - { id: g_cam_last,    type: int,      restore_value: no,  initial_value: "0" }          # the purpose of the frame just processed
  - { id: g_cam_live_until, type: uint32_t, restore_value: no, initial_value: "0" }        # mirror: live until
  - { id: g_cam_view_until, type: uint32_t, restore_value: no, initial_value: "0" }        # a photo on screen until
  - { id: g_guard,       type: bool,     restore_value: no,  initial_value: "false" }
  - { id: g_guard_ms,    type: uint32_t, restore_value: no,  initial_value: "0" }          # armed from (a grace period to leave)
  - { id: g_follow_x,    type: float,    restore_value: no,  initial_value: "0" }
  - { id: g_follow_y,    type: float,    restore_value: no,  initial_value: "0" }
  - { id: g_follow_ms,   type: uint32_t, restore_value: no,  initial_value: "0" }          # last movement seen
  - { id: g_cam_jpg,     type: "std::vector<uint8_t>", restore_value: no }
  - { id: g_game,        type: int,      restore_value: no,  initial_value: "0" }
  - { id: g_gph,         type: int,      restore_value: no,  initial_value: "0" }      # phase
  - { id: g_gt0,         type: uint32_t, restore_value: no,  initial_value: "0" }      # phase start
  - { id: g_gin,         type: int,      restore_value: no,  initial_value: "-1" }     # input this phase: 0..2 a pick, 9 a tap
  - { id: g_gin_pad,     type: bool,     restore_value: no,  initial_value: "false" }  # …from a head pad (100 ms resolution)
  - { id: g_gin_ms,      type: uint32_t, restore_value: no,  initial_value: "0" }
  - { id: g_gflag,       type: bool,     restore_value: no,  initial_value: "false" }  # once-per-phase work done
  - { id: g_gval,        type: int,      restore_value: no,  initial_value: "0" }      # your pick / the coin / the die / the answer
  - { id: g_rps_me,      type: int,      restore_value: no,  initial_value: "0" }
  - { id: g_rps_sy,      type: int,      restore_value: no,  initial_value: "0" }
  - { id: g_rps_sm,      type: int,      restore_value: no,  initial_value: "0" }
  - { id: g_rps_miss,    type: int,      restore_value: no,  initial_value: "0" }      # picks missed in a row
  - { id: g_gwait,       type: uint32_t, restore_value: no,  initial_value: "0" }      # reaction: how long to wait
  - { id: g_rx_ms,       type: int,      restore_value: no,  initial_value: "0" }
  - { id: g_rx_best,     type: int,      restore_value: yes, initial_value: "0" }      # best reaction, ms (screen taps)
  - { id: g_game_led,    type: int,      restore_value: no,  initial_value: "0" }
  - { id: g_game_led_t0, type: uint32_t, restore_value: no,  initial_value: "0" }

font:
  - file: "gfonts://Rubik@600"
    id: f_game
    size: 17
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Rubik@700"
    id: f_big
    size: 44
    glyphs: " !'.?·0123456789:~ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

image:
  - { platform: file, file: "${img_base}/glove_scissors_r.png", id: img_gl_sc_r, type: RGB565, transparency: alpha_channel }
  - { platform: file, file: "${img_base}/glove_scissors_l.png", id: img_gl_sc_l, type: RGB565, transparency: alpha_channel }

switch:
  - platform: template
    id: sw_follow
    name: "Follow me"
    icon: mdi:eye-outline
    optimistic: true
    restore_mode: ALWAYS_OFF        # the camera runs while this is on (the green dot stays lit)
  - platform: template
    id: sw_guard
    name: "Desk guard"
    icon: mdi:shield-account-outline
    lambda: 'return id(g_guard);'
    turn_on_action: [ { script.execute: guard_arm } ]
    turn_off_action: [ { script.execute: { id: guard_disarm, welcome: false } } ]

api:
  actions:
    # start a game from Home Assistant (and its voice commands): game = rps | coin | dice | 8ball |
    # reaction | bang | chameleon | photo | mirror | guard | follow, or games (the Games screen)
    - action: play_game
      variables:
        game: string
      then:
        - lambda: |-
            std::string s = game; for (auto &c : s) c = tolower(c);
            int g = s == "rps" ? 1 : s == "coin" ? 2 : s == "dice" ? 3 : s == "8ball" ? 4 : s == "reaction" ? 5 : s == "bang" ? 6
                  : s == "chameleon" ? 7 : s == "photo" ? 8 : s == "mirror" ? 9 : s == "guard" ? 10 : s == "follow" ? 11 : 0;
            if (g == 0 && s != "games") return;
            if (id(g_sleep)) id(mode_set).execute(id(g_mode_before) == 2 ? 0 : id(g_mode_before), false);   // asked to play: it wakes up
            if (g) id(game_start).execute(g); else id(show_screen).execute(4);

lvgl:
  top_layer:
    widgets:
      # what the camera saw (photo, guard, mirror): 160x120, shown at x2 over everything
      - image: { id: cam_view, src: img_spark, align: CENTER, hidden: true, clickable: true, on_click: [ { script.execute: { id: game_start, g: 8 } } ] }
      - obj: { id: flash_rect, x: 0, y: 0, width: 320, height: 240, bg_color: 0xFFFFFF, bg_opa: COVER, border_width: 0, radius: 0, hidden: true }
  pages:
    - id: page_games
      bg_color: 0x000000
      scrollable: false
      on_swipe_left: [ { script.execute: { id: show_screen, n: 0 } } ]
      on_swipe_right: [ { script.execute: { id: show_screen, n: 3 } } ]
      widgets:
        - label: { id: gms_title, x: 12, y: 5, text: "Games", text_font: f_tile, text_color: 0x7FA9A4 }
        - obj: { styles: st_tile, x: 8, y: 28, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 1 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Rock paper\nscissors", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 111, y: 28, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 6 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Bang!", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 214, y: 28, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 5 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Reaction", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 8, y: 80, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 2 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Coin", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 111, y: 80, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 3 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Dice", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 214, y: 80, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 4 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Magic\n8-ball", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 8, y: 132, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 7 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Chameleon", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 111, y: 132, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 8 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Photo", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 214, y: 132, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 9 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Mirror", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 8, y: 184, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 10 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Desk guard", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 111, y: 184, width: 98, height: 48, on_click: [ { script.execute: { id: game_tap, g: 11 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Follow me", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
        - obj: { styles: st_tile, x: 214, y: 184, width: 98, height: 48, on_click: [ { script.execute: { id: show_screen, n: 0 } } ], widgets: [ { label: { align: CENTER, text_align: CENTER, text: "Face", text_font: f_tile, text_color: 0xDDF7F4 } } ] }
    - id: page_game
      bg_color: 0x000000
      scrollable: false
      widgets:
        - obj: { id: gm_e1, styles: st_shape, x: 128, y: 10, width: 24, height: 30, radius: 10, bg_color: 0x5EF0E2 }
        - obj: { id: gm_e2, styles: st_shape, x: 168, y: 10, width: 24, height: 30, radius: 10, bg_color: 0x5EF0E2 }
        - label: { id: gm_score, x: 10, y: 14, text: "", text_font: f_game, text_color: 0x7FA9A4 }
        - image: { id: gm_you, src: img_gl_fist_l, x: 42, y: 58, hidden: true }
        - image: { id: gm_me,  src: img_gl_fist_r, x: 186, y: 58, hidden: true }
        - label: { id: gm_big, align: TOP_MID, y: 56, text: "", text_font: f_big, text_color: 0xF2FFFD }
        - label: { id: gm_sub, align: TOP_MID, y: 112, width: 300, text_align: CENTER, long_mode: WRAP, text: "", text_font: f_game, text_color: 0x9CC7C1 }
        # the whole stage is a tap target (coin, dice, 8-ball, reaction)…
        - obj: { id: gm_tap, x: 0, y: 44, width: 320, height: 196, bg_opa: TRANSP, border_width: 0, pad_all: 0, hidden: true, on_click: [ { script.execute: { id: game_input, k: 9, pad: false } } ] }
        # …except in rock paper scissors, where these three are
        - obj: { id: gm_b0, styles: st_tile, x: 8,   y: 166, width: 98, height: 68, hidden: true, on_click: [ { script.execute: { id: game_input, k: 0, pad: false } } ], widgets: [ { image: { id: gm_i0, src: img_gl_fist_r,  align: CENTER } } ] }
        - obj: { id: gm_b1, styles: st_tile, x: 111, y: 166, width: 98, height: 68, hidden: true, on_click: [ { script.execute: { id: game_input, k: 1, pad: false } } ], widgets: [ { image: { id: gm_i1, src: img_gl_open_r,  align: CENTER } } ] }
        - obj: { id: gm_b2, styles: st_tile, x: 214, y: 166, width: 98, height: 68, hidden: true, on_click: [ { script.execute: { id: game_input, k: 2, pad: false } } ], widgets: [ { image: { id: gm_i2, src: img_gl_sc_r,    align: CENTER } } ] }
        - obj: { id: gm_x, styles: st_tile, x: 272, y: 6, width: 42, height: 30, on_click: [ { script.execute: game_end } ], widgets: [ { label: { text: "X", align: CENTER, text_font: f_game, text_color: 0x7FA9A4 } } ] }

script:
  - id: game_start
    parameters: { g: int }
    then:
      - if:
          condition: { lambda: 'return g == 6;' }     # Bang!: it is played on the face
          then:
            - script.execute: { id: show_screen, n: 0 }
            - script.execute: { id: hint, txt: "Point a finger right at me. Then shout BOOM!", ms: 6000 }
      - if:
          condition: { lambda: 'return g == 7;' }     # Chameleon: played on the face
          then: [ { script.execute: chameleon_start } ]
      - if:
          condition: { lambda: 'return g == 8;' }
          then: [ { script.execute: photo_start } ]
      - if:
          condition: { lambda: 'return g == 9;' }
          then: [ { script.execute: mirror_start } ]
      - if:
          condition: { lambda: 'return g == 10;' }
          then: [ { script.execute: guard_arm } ]
      - if:
          condition: { lambda: 'return g == 11;' }
          then:
            - switch.toggle: sw_follow
            - script.execute: { id: show_screen, n: 0 }
            - script.execute:
                id: hint
                txt: !lambda 'return id(sw_follow).state ? std::string("Follow me: on. Move in front of me!") : std::string("Follow me: off");'
                ms: 4000
      - if:
          condition: { lambda: 'return g >= 12;' }     # not built yet
          then:
            - lvgl.label.update: { id: gms_title, text: "Games · coming soon" }
            - delay: 2s
            - lvgl.label.update: { id: gms_title, text: "Games" }
      - if:
          condition: { lambda: 'return g >= 1 && g <= 5;' }
          then:
            - lambda: |-
                id(g_game) = g; id(g_gph) = 0; id(g_gt0) = millis(); id(g_gin) = -1; id(g_gflag) = false;
                id(g_rps_sy) = 0; id(g_rps_sm) = 0; id(g_rps_miss) = 0; id(g_game_led) = 0;
                lv_obj_t *I[3] = {id(gm_i0), id(gm_i1), id(gm_i2)};
                for (auto *o : I) lv_image_set_scale(o, 150);           // the gloves at 0.6 in the buttons
                lv_image_set_scale(id(gm_you), 300); lv_image_set_scale(id(gm_me), 300);
            - script.execute: { id: show_screen, n: 5 }
            - if:
                condition: { lambda: 'return id(sw_leds).state && id(n_led).state > 0;' }
                then:
                  - light.turn_on: { id: stackchan_light_bar, brightness: !lambda 'return id(n_led).state / 100.0f;', effect: "Dravix" }

  # CHAMELEON: hold something colourful in front of it; its eyes take that colour for a minute
  - id: chameleon_start
    mode: restart
    then:
      - script.execute: { id: show_screen, n: 0 }
      - lvgl.label.update: { id: face_hint, text: "Hold something colourful in front of me..." }
      - lvgl.widget.show: face_hint
      - script.execute: { id: face_set, s: 5 }
      - delay: 3s
      - lvgl.label.update: { id: face_hint, text: "Looking..." }
      - lambda: 'id(g_cam_purpose) = 1; id(cam).request_image(esphome::camera::IDLE);'
      - delay: 4s
      - if:
          condition: { lambda: 'return id(g_cam_purpose) == 1;' }   # no frame came back
          then:
            - lambda: 'id(g_cam_purpose) = 0;'
            - lvgl.label.update: { id: face_hint, text: "My camera didn't answer." }
            - delay: 3s
      - lvgl.widget.hide: face_hint

  # PHOTO: 3-2-1, a white flash, the picture on screen; Home Assistant can save and send it
  - id: photo_start
    mode: single
    then:
      - lambda: 'id(g_cam_live_until) = 0; id(g_cam_view_until) = 0;'
      - lvgl.widget.hide: cam_view
      - script.execute: { id: show_screen, n: 0 }
      - script.execute: { id: face_set, s: 1 }
      - lvgl.widget.show: face_hint
      - lvgl.label.update: { id: face_hint, text: "Smile! 3" }
      - delay: 800ms
      - lvgl.label.update: { id: face_hint, text: "Smile! 2" }
      - delay: 800ms
      - lvgl.label.update: { id: face_hint, text: "Smile! 1" }
      - delay: 800ms
      - lvgl.widget.hide: face_hint
      - lambda: 'id(g_cam_purpose) = 2; id(cam).request_image(esphome::camera::IDLE);'
      - lvgl.widget.show: flash_rect
      - delay: 150ms
      - lvgl.widget.hide: flash_rect

  # MIRROR: what the camera sees, live, for 20 s; a tap takes a photo
  - id: mirror_start
    then:
      - script.execute: { id: show_screen, n: 0 }
      - lambda: 'id(g_on_face) = false; id(g_cam_live_until) = millis() + 20000; id(g_cam_purpose) = 4; id(cam).request_image(esphome::camera::IDLE);'

  # DESK GUARD: armed after 10 s; someone coming close gets a "Who are you?!" and a photo
  - id: guard_arm
    then:
      - lambda: 'id(g_guard) = true; id(g_guard_ms) = millis() + 10000;'
      - script.execute: { id: show_screen, n: 0 }
      - lvgl.label.update: { id: face_hint, text: "Guarding your desk in 10 s. Touch my head to stop." }
      - lvgl.widget.show: face_hint
      - delay: 6s
      - lvgl.widget.hide: face_hint
  - id: guard_disarm
    parameters: { welcome: bool }
    then:
      - lambda: 'id(g_guard) = false;'
      - if:
          condition: { lambda: 'return welcome;' }
          then:
            - script.execute: { id: face_set, s: 9 }
            - lvgl.label.update: { id: face_hint, text: "Welcome back! Guard is off." }
            - lvgl.widget.show: face_hint
            - delay: 4s
            - lvgl.widget.hide: face_hint
  - id: guard_alert
    mode: single
    then:
      - script.execute: { id: show_screen, n: 0 }
      - script.execute: { id: face_set, s: 5 }
      - lvgl.label.update: { id: face_hint, text: "Who are you?!" }
      - lvgl.widget.show: face_hint
      - lambda: 'id(g_cam_purpose) = 3; id(cam).request_image(esphome::camera::IDLE);'
      - delay: 5s
      - lvgl.widget.hide: face_hint
      - delay: 25s           # one alert per half minute

  # a frame the robot asked for. 1/8 (40x30) is plenty for a colour or for movement; a photo or
  # the mirror is decoded at 1/2 (160x120, shown x2) into one PSRAM buffer
  - id: cam_process
    then:
      - lambda: |-
          int purpose = id(g_cam_purpose); id(g_cam_purpose) = 0; id(g_cam_last) = purpose;
          auto &jpg = id(g_cam_jpg);
          if (jpg.empty()) return;
          static uint16_t small[40 * 30];
          static uint8_t *view = nullptr;
          static lv_image_dsc_t dsc;
          bool big = purpose == 2 || purpose == 3 || purpose == 4;
          if (big && view == nullptr) {
            view = (uint8_t *) heap_caps_malloc(160 * 120 * 2, MALLOC_CAP_SPIRAM);
            memset(&dsc, 0, sizeof dsc);
            dsc.header.magic = LV_IMAGE_HEADER_MAGIC; dsc.header.cf = LV_COLOR_FORMAT_RGB565;
            dsc.header.w = 160; dsc.header.h = 120; dsc.header.stride = 160 * 2;
            dsc.data_size = 160 * 120 * 2; dsc.data = view;
          }
          bool ok = big ? (view != nullptr && jpg2rgb565(jpg.data(), jpg.size(), view, JPG_SCALE_2X))
                        : jpg2rgb565(jpg.data(), jpg.size(), (uint8_t *) small, JPG_SCALE_8X);
          jpg.clear(); jpg.shrink_to_fit();
          if (!ok) { ESP_LOGW("dravix", "camera: could not decode the frame"); return; }
          if (big) {
            lv_obj_t *o = id(cam_view);
            // (no image cache in ESPHome's LVGL: the raw buffer is read on every redraw, so an invalidate is enough)
            lv_image_set_src(o, &dsc); lv_image_set_scale(o, 512);
            lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); lv_obj_invalidate(o);
            lv_obj_move_foreground(id(priv_dot));               // the green dot stays on top
            if (purpose == 4 && millis() < id(g_cam_live_until)) { id(g_cam_purpose) = 4; id(cam).request_image(esphome::camera::IDLE); }
            else if (purpose != 4) id(g_cam_view_until) = millis() + (purpose == 2 ? 4000 : 3000);
            return;
          }
          if (purpose == 5) {                                    // FOLLOW ME: where did the picture change?
            static uint8_t prev[40 * 30]; static bool have = false;
            float sx = 0, sy = 0, sw = 0;
            for (int i = 0; i < 40 * 30; i++) {
              uint16_t p = small[i];
              uint8_t l = (uint8_t) ((((p >> 11) & 0x1F) * 8 + ((p >> 5) & 0x3F) * 4 * 2 + (p & 0x1F) * 8) / 4);
              int d = have ? abs((int) l - (int) prev[i]) : 0;
              prev[i] = l;
              if (d > 18) { sx += (i % 40) * d; sy += (i / 40) * d; sw += d; }
            }
            have = true;
            if (sw > 600) {
              // the camera looks at you: your left is its right, so the eyes mirror the picture
              id(g_follow_x) = -((sx / sw) - 19.5f) / 19.5f * 22; id(g_follow_y) = ((sy / sw) - 14.5f) / 14.5f * 12;
              id(g_follow_ms) = millis();
            }
            return;
          }
          if (purpose == 1) {
            float R = 0, G = 0, B = 0; int n = 0;
            for (int y = 8; y < 22; y++) for (int x = 10; x < 30; x++) {
              uint16_t p = small[y * 40 + x];
              R += ((p >> 11) & 0x1F) * 255.0f / 31; G += ((p >> 5) & 0x3F) * 255.0f / 63; B += (p & 0x1F) * 255.0f / 31; n++;
            }
            R /= n; G /= n; B /= n;
            float mx = std::max(R, std::max(G, B)), mn = std::min(R, std::min(G, B));
            float sat = mx > 1 ? (mx - mn) / mx : 0;
            ESP_LOGI("dravix", "chameleon: saw r%.0f g%.0f b%.0f (saturation %.2f)", R, G, B, sat);
            if (sat < .15f || mx < 25) { id(face_set).execute(7); lv_label_set_text(id(face_hint), "Hmm, I can't see a colour."); return; }
            // make it vivid: the strongest channel to full, the weakest towards zero
            auto vivid = [&](float c) { float v = (c - mn * .7f) / (mx - mn * .7f) * 255; return (uint32_t) std::max(0.0f, std::min(255.0f, v)); };
            id(g_eye_rgb) = (vivid(R) << 16) | (vivid(G) << 8) | vivid(B);
            id(g_eye_until) = millis() + 60000;
            id(face_set).execute(1);
            lv_label_set_text(id(face_hint), "Ta-da!");
          }

  # photo and guard frames tell Home Assistant (an automation there can save and send them)
  - id: cam_tell_ha
    then:
      - if:
          condition: { lambda: 'return id(g_cam_last) == 2 || id(g_cam_last) == 3;' }
          then:
            - homeassistant.event:
                event: esphome.dravix_photo
                data:
                  reason: !lambda 'return id(g_cam_last) == 2 ? std::string("photo") : std::string("guard");'

  # a Games button: not the release of a swipe that started on it
  - id: game_tap
    parameters: { g: int }
    then:
      - if:
          condition: { lambda: 'return millis() - id(g_swipe_ms) > 700;' }
          then: [ { script.execute: { id: game_start, g: !lambda 'return g;' } } ]

  # a line of help over the face for a few seconds (a new one replaces it)
  - id: hint
    parameters: { txt: string, ms: int }
    mode: restart
    then:
      - lvgl.label.update: { id: face_hint, text: !lambda 'return txt;' }
      - lvgl.widget.show: face_hint
      - delay: !lambda 'return ms;'
      - lvgl.widget.hide: face_hint

  - id: game_end
    then:
      - lambda: 'id(g_game) = 0; id(g_game_led) = 0;'
      - light.turn_off: { id: stackchan_light_bar }
      - script.execute: { id: show_screen, n: 4 }

  - id: game_input
    parameters: { k: int, pad: bool }
    then:
      - lambda: |-
          if (id(g_game) == 0) return;
          id(g_gin) = k; id(g_gin_pad) = pad; id(g_gin_ms) = millis(); id(g_page_ms) = millis(); id(g_ia_ms) = millis();

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          bool live = id(g_cam_live_until) != 0 && now < id(g_cam_live_until);
          bool photo = id(g_cam_view_until) != 0 && now < id(g_cam_view_until);
          if (!live && id(g_cam_live_until) != 0) { id(g_cam_live_until) = 0; id(g_on_face) = id(g_page) == 0; }
          if (!photo && id(g_cam_view_until) != 0) id(g_cam_view_until) = 0;
          if (!live && !photo && !lv_obj_has_flag(id(cam_view), LV_OBJ_FLAG_HIDDEN)) lv_obj_add_flag(id(cam_view), LV_OBJ_FLAG_HIDDEN);
          // the wake word or a voice turn ends the mirror at once
          if (live && id(g_voice)) { id(g_cam_live_until) = 0; }
  - interval: 700ms
    then:
      - lambda: |-
          // FOLLOW ME: a frame every 0.7 s, only with someone near, on the resting face, no voice turn
          if (!id(sw_follow).state || !id(g_near) || !id(g_on_face) || id(g_voice) || id(g_sleep) || id(g_saver) || id(g_cam_purpose) != 0) return;
          int f = id(g_face); if (f != 0 && f != 18) return;
          id(g_cam_purpose) = 5; id(cam).request_image(esphome::camera::IDLE);
  - interval: 50ms
    then:
      - lambda: |-
          int g = id(g_game);
          if (g == 0) return;
          const uint32_t now = millis();
          id(g_page_ms) = now;                                   // a game in progress never times out
          int ph = id(g_gph), in = id(g_gin);
          float t = (now - id(g_gt0)) / 1000.0f;
          auto setp = [&](int p) { id(g_gph) = p; id(g_gt0) = now; id(g_gin) = -1; id(g_gflag) = false; ph = p; t = 0; in = -1; };
          auto txt = [](lv_obj_t *o, const char *s) { if (strcmp(lv_label_get_text(o), s) != 0) lv_label_set_text(o, s); };
          auto vis = [](lv_obj_t *o, bool on) { bool hidden = lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN); if (on && hidden) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else if (!on && !hidden) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN); };
          auto led = [&](int m) { if (id(g_game_led) != m) { id(g_game_led) = m; id(g_game_led_t0) = now; } };
          // the little eyes: 0 calm, 1 happy, 2 sad, 3 wide, 4 green "now", 5 amber "wait", 6 looking up
          static int mood_last = -1;
          auto eyes = [&](int m) {
            if (m == mood_last) return;
            mood_last = m;
            int w = 24, h = 30, y = 10, r = 10, dy2 = 0; uint32_t c = 0x5EF0E2;
            if (m == 1) { h = 12; y = 18; r = 6; }
            if (m == 2) { h = 20; y = 18; r = 8; dy2 = 0; }
            if (m == 3) { w = 28; h = 34; y = 8; r = 14; }
            if (m == 4) { c = 0x35F57A; w = 28; h = 34; y = 8; r = 14; }
            if (m == 5) { c = 0xFFA81F; h = 16; y = 16; r = 8; }
            if (m == 6) { h = 24; y = 4; }
            lv_obj_t *E[2] = {id(gm_e1), id(gm_e2)};
            for (int i = 0; i < 2; i++) {
              lv_obj_set_size(E[i], w, h); lv_obj_set_pos(E[i], (i ? 168 : 128) - (w - 24) / 2, y + dy2);
              lv_obj_set_style_radius(E[i], r, 0); lv_obj_set_style_bg_color(E[i], lv_color_hex(c), 0);
            }
          };
          lv_obj_t *BIG = id(gm_big), *SUB = id(gm_sub), *SC = id(gm_score), *YOU = id(gm_you), *ME = id(gm_me), *TAP = id(gm_tap);
          lv_obj_t *B[3] = {id(gm_b0), id(gm_b1), id(gm_b2)};
          auto glove = [&](lv_obj_t *o, int pick, bool left) {
            image::Image *im = pick == 0 ? (left ? id(img_gl_fist_l) : id(img_gl_fist_r)) : pick == 1 ? (left ? id(img_gl_open_l) : id(img_gl_open_r)) : (left ? id(img_gl_sc_l) : id(img_gl_sc_r));
            lv_image_set_src(o, im->get_lv_image_dsc());
          };
          static const char *const PICK[3] = {"Rock", "Paper", "Scissors"};
          bool tap = in >= 0;
          char b[64];

          if (g == 1) {                                          // ── ROCK PAPER SCISSORS: first to 2
            vis(TAP, false);
            snprintf(b, sizeof b, "You %d  ·  %d Me", id(g_rps_sy), id(g_rps_sm)); txt(SC, b);
            switch (ph) {
              case 0:
                eyes(3); led(0); txt(BIG, "Ready?"); txt(SUB, "First to 2 wins. Pick on the screen, or touch my head: front, middle, back.");
                vis(YOU, false); vis(ME, false); for (auto *o : B) vis(o, false);
                if (t > 3) setp(1);
                break;
              case 1: {                                          // "Rock... Paper... Scissors..." with both fists pumping
                static const char *const W[3] = {"Rock", "Paper", "Scissors"};
                int w = std::min(2, (int) (t / .8f));
                float bob = fabsf(sinf(t / .8f * 3.14159f));
                txt(BIG, ""); txt(SUB, W[w]); eyes(0); led(1);
                for (auto *o : B) vis(o, false);
                vis(YOU, true); vis(ME, true); glove(YOU, 0, true); glove(ME, 0, false);
                lv_obj_set_y(YOU, 50 + (int) (bob * 22)); lv_obj_set_y(ME, 50 + (int) (bob * 22));
                if (t > 2.4f) { id(g_rps_me) = random_uint32() % 3; setp(2); }
              } break;
              case 2:                                            // "Shoot!" — your pick
                txt(BIG, "Shoot!"); txt(SUB, ""); eyes(3); led(2);
                vis(YOU, false); vis(ME, false); for (auto *o : B) vis(o, true);
                if (in >= 0 && in <= 2) { id(g_gval) = in; id(g_rps_miss) = 0; setp(3); }
                else if (t > 6) {
                  if (++id(g_rps_miss) >= 2) { id(game_end).execute(); return; }   // nobody is playing
                  txt(SUB, "Too slow!"); setp(1);
                }
                break;
              case 3: {                                          // reveal
                int you = id(g_gval), me = id(g_rps_me), r = (you - me + 3) % 3;   // 0 tie, 1 you win, 2 I win
                if (!id(g_gflag)) { id(g_gflag) = true; if (r == 1) id(g_rps_sy)++; else if (r == 2) id(g_rps_sm)++; }
                for (auto *o : B) vis(o, false);
                vis(YOU, true); vis(ME, true); glove(YOU, you, true); glove(ME, me, false);
                lv_obj_set_y(YOU, 50); lv_obj_set_y(ME, 50);
                txt(BIG, ""); snprintf(b, sizeof b, "%s! %s vs %s", r == 0 ? "Tie" : r == 1 ? "You win" : "I win", PICK[you], PICK[me]); txt(SUB, b);
                eyes(r == 2 ? 1 : r == 1 ? 2 : 6); led(r == 1 ? 3 : r == 2 ? 4 : 5);
                if (t > 2.8f) { if (id(g_rps_sy) >= 2 || id(g_rps_sm) >= 2) setp(4); else setp(1); }
              } break;
              case 4: {                                          // the match
                bool youwon = id(g_rps_sy) > id(g_rps_sm);
                vis(YOU, false); vis(ME, false);
                txt(BIG, youwon ? "You won!" : "I won!"); txt(SUB, youwon ? "Well played. Tap X, or play again from Games." : "Hehe. Rematch?");
                eyes(youwon ? 2 : 1); led(youwon ? 3 : 4);
                if (t > 5) id(game_end).execute();
              } break;
            }
            return;
          }

          // the tap games share the stage: tap anywhere, or touch any head pad
          for (auto *o : B) vis(o, false);
          vis(YOU, false); vis(ME, false); vis(TAP, true); txt(SC, "");
          if (g == 2 || g == 3) {                                // ── COIN / DICE
            bool coin = g == 2;
            if (ph == 0) {                                       // spinning, slowing down
              if (!id(g_gflag)) { id(g_gflag) = true; id(g_gval) = coin ? (int) (random_uint32() % 2) : 1 + (int) (random_uint32() % 6); }
              int k = (int) (sqrtf(t) * 9);
              if (coin) txt(BIG, k % 2 ? "Tails" : "Heads"); else { snprintf(b, sizeof b, "%d", 1 + k % 6); txt(BIG, b); }
              txt(SUB, coin ? "Flipping..." : "Rolling..."); eyes(6); led(6);
              if (t > 2) setp(1);
            } else {                                             // the result
              if (coin) txt(BIG, id(g_gval) ? "Tails" : "Heads"); else { snprintf(b, sizeof b, "%d", id(g_gval)); txt(BIG, b); }
              txt(SUB, "Tap for another go"); eyes(1); led(3);
              if (tap && t > .4f) setp(0);
              else if (t > 15) id(game_end).execute();
            }
            return;
          }
          if (g == 4) {                                          // ── MAGIC 8-BALL
            static const char *const A[8] = {"Yes!", "No.", "Maybe", "Ask again", "Definitely!", "Not now", "Of course!", "I doubt it"};
            if (ph == 0) {
              txt(BIG, "8-ball"); txt(SUB, "Ask a yes or no question, then touch my head or the screen."); eyes(0); led(0);
              if (tap) setp(1); else if (t > 30) id(game_end).execute();
            } else if (ph == 1) {
              int d = 1 + ((int) (t * 3)) % 3; txt(BIG, d == 1 ? "." : d == 2 ? ".." : "..."); txt(SUB, "Thinking"); eyes(6); led(7);
              if (t > 1.8f) { id(g_gval) = random_uint32() % 8; setp(2); }
            } else {
              txt(BIG, A[id(g_gval) % 8]); txt(SUB, "Tap to ask again"); eyes(id(g_gval) % 2 ? 2 : 1); led(id(g_gval) % 2 ? 4 : 3);
              if (tap && t > .4f) setp(1); else if (t > 20) id(game_end).execute();
            }
            return;
          }
          if (g == 5) {                                          // ── REACTION
            if (ph == 0) {
              txt(BIG, "Reaction"); txt(SUB, "When my eyes turn green, touch my head or the screen as fast as you can."); eyes(0); led(0);
              if (t > 3.5f || tap) setp(1);
            } else if (ph == 1) {                                // wait a random 1.5..4 s
              if (!id(g_gflag)) { id(g_gflag) = true; id(g_gwait) = 1500 + random_uint32() % 2500; }
              txt(BIG, "Wait..."); txt(SUB, ""); eyes(5); led(8);
              if (tap) { id(g_rx_ms) = -1; setp(3); }            // too soon
              else if ((now - id(g_gt0)) > id(g_gwait)) setp(2);
            } else if (ph == 2) {                                // GO
              txt(BIG, "NOW!"); eyes(4); led(9);
              if (tap) { id(g_rx_ms) = (int) (id(g_gin_ms) - id(g_gt0)); if (!id(g_gin_pad) && (id(g_rx_best) == 0 || id(g_rx_ms) < id(g_rx_best))) id(g_rx_best) = id(g_rx_ms); setp(3); }
              else if (t > 4) { id(g_rx_ms) = -2; setp(3); }
            } else {                                             // the result
              int ms = id(g_rx_ms);
              if (ms == -1) { txt(BIG, "Too soon!"); eyes(2); led(4); }
              else if (ms == -2) { txt(BIG, "Asleep?"); eyes(6); led(5); }
              else {
                // pads are read every 100 ms: their times are shown to a tenth only
                if (id(g_gin_pad)) snprintf(b, sizeof b, "~%.1f s", ms / 1000.0f); else snprintf(b, sizeof b, "%.2f s", ms / 1000.0f);
                txt(BIG, b); eyes(1); led(3);
              }
              if (id(g_rx_best) > 0) snprintf(b, sizeof b, "Best %.2f s · tap to go again", id(g_rx_best) / 1000.0f); else snprintf(b, sizeof b, "Tap to go again");
              txt(SUB, b);
              if (tap && t > .6f) setp(1); else if (t > 15) id(game_end).execute();
            }
            return;
          }
