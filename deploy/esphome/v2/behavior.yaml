# ════════════════════════════════════════════════════════════════════════════════
#  Dravix v2 · behavior — what makes it feel alive. Everything is read ON the robot
#  (no sensors imported back from Home Assistant, so renaming the device breaks nothing).
#  It only ever ASKS the face for a state (face_set / face_rest); face.yaml decides.
# ════════════════════════════════════════════════════════════════════════════════
substitutions:
  prox_near: "150"            # proximity counts above this = someone is close
  prox_far: "80"              # …below this = they left
  lux_dark: "5"               # lux below this for a minute = the room is dark
  lux_bright: "30"            # lux above this = the light is back
  head_straight: "6"          # up/down servo angle that looks straight ahead (5..85)
  prox_aim: "650"             # proximity counts of a finger right at the sensor: "aiming" (Bang!)

globals:
  - { id: g_ia_ms,      type: uint32_t, restore_value: no, initial_value: "0" }      # last interaction
  - { id: g_near,       type: bool,     restore_value: no, initial_value: "false" }
  - { id: g_away_ms,    type: uint32_t, restore_value: no, initial_value: "0" }      # when they left
  - { id: g_prox_ms,    type: uint32_t, restore_value: no, initial_value: "0" }      # last proximity reading
  - { id: g_dark_ms,    type: uint32_t, restore_value: no, initial_value: "0" }      # dark since (0 = not dark)
  - { id: g_pads,       type: int,      restore_value: no, initial_value: "0" }      # bit per touched pad
  - { id: g_pet_ms,     type: uint32_t, restore_value: no, initial_value: "0" }      # this pet started
  - { id: g_pet_loved,  type: bool,     restore_value: no, initial_value: "false" }
  - { id: g_move_ms,    type: uint32_t, restore_value: no, initial_value: "0" }      # last head move (IMU ignores itself)
  - { id: g_jolts,      type: int,      restore_value: no, initial_value: "0" }
  - { id: g_jolt_ms,    type: uint32_t, restore_value: no, initial_value: "0" }
  - { id: g_shakes,     type: int,      restore_value: no, initial_value: "0" }
  - { id: g_shake_ms,   type: uint32_t, restore_value: no, initial_value: "0" }
  - { id: g_lift_ms,    type: uint32_t, restore_value: no, initial_value: "0" }      # off-gravity since (0 = resting)
  - { id: g_timer_ms,   type: uint32_t, restore_value: no, initial_value: "0" }      # timer started ringing
  - { id: g_aim_ms,     type: uint32_t, restore_value: no, initial_value: "0" }      # a finger at the sensor since
  - { id: g_aim_fired,  type: bool,     restore_value: no, initial_value: "false" }  # hands went up for this aim
  - { id: g_far_ms,     type: uint32_t, restore_value: no, initial_value: "0" }      # the hand went away since
  - { id: g_snd_base,   type: float,    restore_value: no, initial_value: "-60" }    # the room's usual peak level, dBFS

number:
  - { platform: template, id: n_saver_min, name: "Screensaver after", icon: mdi:timer-sand, unit_of_measurement: "min", min_value: 1, max_value: 60, step: 1, optimistic: true, restore_value: true, initial_value: 5, entity_category: config }
  - { platform: template, id: n_night_from, name: "Night from", icon: mdi:weather-night, unit_of_measurement: "h", min_value: 0, max_value: 23, step: 1, optimistic: true, restore_value: true, initial_value: 23, entity_category: config }
  - { platform: template, id: n_night_until, name: "Night until", icon: mdi:weather-sunset-up, unit_of_measurement: "h", min_value: 0, max_value: 23, step: 1, optimistic: true, restore_value: true, initial_value: 7, entity_category: config }
  - { platform: template, id: n_bang_db, name: "Bang loudness", icon: mdi:volume-high, unit_of_measurement: "dBFS", min_value: -40, max_value: -1, step: 1, optimistic: true, restore_value: true, initial_value: -15, entity_category: config }
  - { platform: template, id: n_bored_min, name: "Bored after", icon: mdi:sleep, unit_of_measurement: "min", min_value: 2, max_value: 60, step: 1, optimistic: true, restore_value: true, initial_value: 8, entity_category: config }

switch:
  - platform: template
    id: sw_head
    name: "Head moves"
    icon: mdi:robot-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_sleep_dark
    name: "Sleep when the room is dark"
    icon: mdi:lightbulb-night-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: sw_asleep
    name: "Asleep"
    icon: mdi:power-sleep
    lambda: 'return id(g_sleep);'
    turn_on_action: [ { script.execute: go_sleep } ]
    turn_off_action: [ { script.execute: { id: wake_up, why: 0 } } ]

text_sensor:
  # the three head pads, polled here at 10 Hz (the BSP's own copies poll once a second)
  - { platform: si12t, id: tp1, channel: CH_1, update_interval: 100ms, internal: true, on_value: [ { script.execute: pads_read } ] }
  - { platform: si12t, id: tp2, channel: CH_2, update_interval: 100ms, internal: true, on_value: [ { script.execute: pads_read } ] }
  - { platform: si12t, id: tp3, channel: CH_3, update_interval: 100ms, internal: true, on_value: [ { script.execute: pads_read } ] }
  - platform: template
    id: st_state
    name: "State"
    icon: mdi:robot-happy-outline
    lambda: |-
      if (id(g_sleep)) return std::string("asleep");
      if (id(g_saver)) return std::string("screensaver");
      int f = id(g_face);
      if (f == 11 || f == 12) return std::string("listening");
      if (f == 13) return std::string("thinking");
      if (f == 14) return std::string("speaking");
      return std::string("awake");
    update_interval: 2s

sensor:
  # BOOM: the peak level of the microphone the wake word already keeps open (passive = no second
  # stream). Only matters while the hands are up; otherwise it learns the room's usual level.
  - platform: sound_level
    microphone: i2s_mic
    passive: true
    measurement_duration: 50ms
    peak:
      id: snd_peak
      internal: true
      on_value:
        - lambda: |-
            if (std::isnan(x)) return;
            if (id(g_face) == 22) {
              // its own head move is noise in the mic: nothing counts for 1.5 s after one
              if (millis() - id(g_move_ms) > 1500 && x > id(n_bang_db).state && x > id(g_snd_base) + 15) id(face_force).execute(23);
            } else {
              id(g_snd_base) += 0.02f * (x - id(g_snd_base));
            }
  - platform: bmi270_bmm150
    i2c_id: bsp_bus
    address: 0x69
    update_interval: 100ms
    acceleration_x: { id: imu_ax, internal: true }
    acceleration_y: { id: imu_ay, internal: true }
    acceleration_z:
      id: imu_az
      internal: true
      on_value:
        - lambda: |-
            float ax = id(imu_ax).state, ay = id(imu_ay).state, az = x;
            if (std::isnan(ax) || std::isnan(ay) || std::isnan(az)) return;
            const uint32_t now = millis();
            if (now < 15000 || now - id(g_move_ms) < 1500 || id(g_game) != 0) { id(g_lift_ms) = 0; return; }   // boot settling / our own head move / a game
            // the driver reports g (its scale is 8/32768 per bit), whatever its log line says; a slow
            // baseline of "gravity" makes this independent of the unit, exactly as v1 did
            float mag = sqrtf(ax * ax + ay * ay + az * az);
            if (mag <= 0) return;
            static float grav = 0; if (grav <= 0) grav = mag;
            float dev = fabsf(mag - grav) / grav;
            grav += 0.02f * (mag - grav);
            // a SHAKE = 3 jolts (> 0.45 g off gravity) within a second
            if (dev > .45f) {
              if (now - id(g_jolt_ms) > 1000) id(g_jolts) = 0;
              id(g_jolts)++; id(g_jolt_ms) = now;
              if (id(g_jolts) >= 3) {
                id(g_jolts) = 0; id(g_ia_ms) = now; id(g_lift_ms) = 0;
                if (now - id(g_shake_ms) > 30000) id(g_shakes) = 0;
                id(g_shakes)++; id(g_shake_ms) = now;
                id(face_set).execute(id(g_shakes) >= 3 ? 4 : 8);     // grumpy after the third shake, else dizzy
                if (id(g_shakes) >= 3) id(g_shakes) = 0;
              }
              return;
            }
            // PICKED UP = held a little off gravity for half a second (and not a shake)
            if (dev > .18f && now - id(g_jolt_ms) > 1500) {
              if (id(g_lift_ms) == 0) id(g_lift_ms) = now;
              else if (now - id(g_lift_ms) > 500) { id(g_lift_ms) = 0; id(g_ia_ms) = now; id(face_set).execute(5); id(g_jolt_ms) = now; }
            } else id(g_lift_ms) = 0;

script:
  # ── the head pads: a pet holds "petted" while touched, becomes "love" after 3 s or with
  #    two pads at once (a hug), and plays its outro when the hand lifts
  - id: pads_read
    mode: restart
    then:
      - lambda: |-
          auto on = [](const std::string &s) { return !s.empty() && s != "No touch"; };
          int pads = (on(id(tp1).state) ? 1 : 0) | (on(id(tp2).state) ? 2 : 0) | (on(id(tp3).state) ? 4 : 0);
          int was = id(g_pads); id(g_pads) = pads;
          const uint32_t now = millis();
          if (pads) id(g_ia_ms) = now;
          if (id(g_game) != 0) {                                 // a game: the pads are its buttons (front, middle, back)
            if (pads && !was) id(game_input).execute((pads & 1) ? 0 : (pads & 2) ? 1 : 2, true);
            return;
          }
          if (id(g_guard) && pads && !was) { id(guard_disarm).execute(true); return; }   // a touch turns the desk guard off
          if (id(g_face) == 22) {                                // hands up: a tap counts as the shot (no BOOM needed)
            if (pads && !was) id(face_force).execute(23);
            return;
          }
          if (pads && !was) {                                    // a hand arrives
            if (id(g_sleep)) { id(wake_up).execute(1); return; }
            if (id(g_saver)) { id(saver_off).execute(); }
            if (id(g_face) == 16) { id(timer_stop).execute(); return; }
            id(g_pet_ms) = now; id(g_pet_loved) = false;
            id(face_set).execute(15);
          }
          int n = ((pads & 1) ? 1 : 0) + ((pads & 2) ? 1 : 0) + ((pads & 4) ? 1 : 0);
          if (pads && !id(g_pet_loved) && (n >= 2 || now - id(g_pet_ms) > 3000) && id(g_face) == 15) {
            id(g_pet_loved) = true; id(face_set).execute(2);    // a hug, or a long pet
          }
          if (!pads && was) id(face_release).execute();          // the hand lifts

  - id: saver_off
    then:
      - lambda: 'id(g_saver) = false; id(g_ia_ms) = millis();'
      - script.execute: face_rest

  - id: go_sleep
    then:
      - lambda: 'id(g_sleep) = true; id(g_saver) = false;'
      - script.execute: { id: face_force, s: 20 }      # falling asleep, then black

  # why: 0 = Home Assistant, 1 = a touch, 2 = the wake word, 3 = morning, 4 = the light
  - id: wake_up
    parameters: { why: int }
    then:
      - if:
          condition: { lambda: 'return id(g_sleep);' }
          then:
            - lambda: 'id(g_sleep) = false; id(g_saver) = false; id(g_ia_ms) = millis(); id(g_dark_ms) = 0;'
            - script.execute: { id: face_force, s: 21 }  # waking up

  # ── timer ringing: three rings every few seconds until a touch, or a minute
  - id: timer_ring
    mode: restart
    then:
      - lambda: 'id(g_timer_ms) = millis();'
      - while:
          condition: { lambda: 'return id(g_face) == 16 && millis() - id(g_timer_ms) < 60000;' }
          then:
            - script.execute: { id: play_sfx, tune: "ring:d=16,o=6,b=200:c,e,g,c7,p,c,e,g,c7" }
            - delay: 3s
      - if:
          condition: { lambda: 'return id(g_face) == 16;' }
          then: [ { script.execute: face_rest } ]
  - id: timer_stop
    then:
      - script.stop: timer_ring
      - script.execute: face_rest

  # ── head moves for the face that just started. Never during a voice turn, never while a
  #    sound plays (a moving servo is noise in the mic and was measured to overflow the
  #    speaker buffer), never asleep or in the screensaver.
  - id: head_for_face
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(sw_head).state && !id(g_voice) && !id(i2s_speaker).is_running()
                     && !id(g_saver) && (!id(g_sleep) || id(g_face) == 20);
          then:
            - lambda: |-
                int f = id(g_face);
                if (f == 16) id(timer_ring).execute();
            - script.execute:
                id: head_gesture
                f: !lambda 'return id(g_face);'
          else:
            - lambda: 'if (id(g_face) == 16) id(timer_ring).execute();'

  - id: head_to
    parameters: { yaw: float, pitch: float }
    then:
      - lambda: 'id(g_move_ms) = millis();'
      - number.set: { id: servo_x_angle, value: !lambda 'return std::max(-60.0f, std::min(60.0f, yaw));' }
      - number.set:
          id: servo_y_angle
          value: !lambda 'float p = ${head_straight} + pitch; return p < 5.0f ? 5.0f : (p > 85.0f ? 85.0f : p);'

  - id: head_gesture
    parameters: { f: int }
    mode: restart
    then:
      - lambda: |-
          // one short gesture per face, in degrees around "straight"
          switch (f) {
            case 1: case 9: case 10:  id(head_seq).execute(0, 8, 0, 0); break;       // a nod: up, then back
            case 2: case 15:          id(head_seq).execute(0, 14, 0, 14); break;     // lifts and stays up a while
            case 4: case 17:          id(head_seq).execute(-12, 0, 12, 0); break;    // shakes "no"
            case 5:                   id(head_seq).execute(0, 10, 0, 0); break;      // jerks up
            case 7:                   id(head_seq).execute(10, 4, 10, 4); break;     // turns a little to the side
            case 8:                   id(head_seq).execute(-10, 4, 10, 4); break;    // wobbles
            case 18:                  id(head_seq).execute(-14, 0, 14, 0); break;    // looks around
            case 21:                  id(head_seq).execute(0, 0, 0, 0); break;       // rises to the middle
            case 22:                  id(head_seq).execute(0, 8, 0, 8); break;       // hands up: head up a little
            case 23:                  id(head_seq).execute(0, 14, 0, 0); break;      // the hit throws the head back, then it drops
            case 24:                  id(head_seq).execute(-6, 4, 6, 4); break;      // shakes it off
            case 0: case 3: case 6: case 20: id(head_seq).execute(0, 0, 0, 0); break; // settles straight
            default: break;
          }
  - id: head_seq
    parameters: { y1: float, p1: float, y2: float, p2: float }
    mode: restart
    then:
      - script.execute: { id: head_to, yaw: !lambda 'return y1;', pitch: !lambda 'return p1;' }
      - delay: 450ms
      - script.execute: { id: head_to, yaw: !lambda 'return y2;', pitch: !lambda 'return p2;' }
      - delay: 450ms
      - if:
          condition: { lambda: 'return id(g_face) != 2 && id(g_face) != 15;' }   # a pet keeps the head up
          then:
            - script.execute: { id: head_to, yaw: 0, pitch: 0 }

esphome:
  on_boot:
    - priority: -200
      then:
        - lambda: |-
            // the BSP's light sensor has no id: find it by name and listen to it on the robot
            const uint32_t boot = millis(); id(g_ia_ms) = boot;
            for (auto *s : App.get_sensors()) {
              std::string n = s->get_name().str();
              if (n == "Proximity counts") s->add_on_state_callback([](float v) {
                const uint32_t now = millis(); id(g_prox_ms) = now;
                if (now < 15000 || std::isnan(v)) return;
                // AIM: a finger right at the sensor for 0.6 s → hands up (once per aim; resting faces only)
                int f = id(g_face);
                bool restful = f == 0 || f == 6 || f == 18;
                if (v > ${prox_aim}) {
                  if (id(g_aim_ms) == 0) id(g_aim_ms) = now;
                  if (!id(g_aim_fired) && now - id(g_aim_ms) > 600 && restful && id(g_game) == 0 && !id(g_sleep) && !id(g_saver) && !id(g_voice) && id(g_on_face)) {
                    id(g_aim_fired) = true; id(face_set).execute(22);
                  }
                } else if (v < ${prox_far}) { id(g_aim_ms) = 0; id(g_aim_fired) = false; }
                // the hand went away without a shot: phew
                if (f == 22 && v < ${prox_near}) { if (id(g_far_ms) == 0) id(g_far_ms) = now; else if (now - id(g_far_ms) > 600) { id(g_far_ms) = 0; id(face_release).execute(); } }
                else id(g_far_ms) = 0;
                if (!id(g_near) && v > ${prox_near}) {
                  id(g_near) = true; id(g_ia_ms) = now;
                  if (id(g_guard) && now > id(g_guard_ms)) id(guard_alert).execute();   // desk guard: someone came close
                  if (id(g_saver)) id(saver_off).execute();
                  if (!id(g_sleep) && id(g_game) == 0 && !id(g_guard) && id(g_away_ms) != 0 && now - id(g_away_ms) > 300000) id(face_set).execute(9);   // hello
                } else if (id(g_near) && v < ${prox_far}) { id(g_near) = false; id(g_away_ms) = now; }
              });
              if (n == "Ambient light") s->add_on_state_callback([](float v) {
                if (std::isnan(v)) return;
                const uint32_t now = millis();
                if (v < ${lux_dark}) { if (id(g_dark_ms) == 0) id(g_dark_ms) = now; }
                else { id(g_dark_ms) = 0; if (v > ${lux_bright} && id(g_sleep)) id(wake_up).execute(4); }
              });
            }

interval:
  # ── the rest clock: screensaver, boredom, night, sleeping in the dark, waking in the morning
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(g_voice) || id(va).is_running()) id(g_ia_ms) = now;               // a conversation is activity
          if (id(g_prox_ms) != 0 && now - id(g_prox_ms) > 120000) id(g_near) = false;   // the sensor goes quiet in the dark
          if (id(g_near)) id(g_ia_ms) = now;
          auto tm = id(ha_time).now();
          bool night = false;
          if (tm.is_valid()) {
            int h = tm.hour, a = (int) id(n_night_from).state, b = (int) id(n_night_until).state;
            night = a > b ? (h >= a || h < b) : (h >= a && h < b);
            if (id(g_sleep) && !night && h == b && tm.minute < 5) id(wake_up).execute(3);   // good morning
          }
          uint32_t idle = now - id(g_ia_ms);
          bool bored = idle > (uint32_t) (id(n_bored_min).state * 60000);
          bool saver = idle > (uint32_t) (id(n_saver_min).state * 60000);
          bool changed = (night != id(g_night)) || (bored != id(g_bored));
          id(g_night) = night; id(g_bored) = bored;
          if (!id(g_sleep) && id(sw_sleep_dark).state && night && id(g_dark_ms) != 0 && now - id(g_dark_ms) > 60000 && idle > 60000) {
            id(go_sleep).execute(); return;
          }
          if (!id(g_sleep) && !id(g_saver) && saver && !id(g_voice)) { id(g_saver) = true; changed = true; if (id(g_page) != 0) id(show_screen).execute(0); }
          int f = id(g_face);
          bool resting = f == 0 || f == 6 || f == 18 || f == 19;
          if (changed && resting) id(face_rest).execute();
