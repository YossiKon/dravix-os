# ════════════════════════════════════════════════════════════════════════════════
#  Dravix · the file you keep in the ESPHome add-on (Home Assistant → ESPHome)
#
#  Make it your robot's config: ESPHome → + New device → name it "stackchan" → Edit →
#  replace everything with this file → Save → Install.
#  It pulls the firmware from GitHub on every Install, so updating = pressing Install.
#
#  Had the old dravix-os robot? Keep your file as it is: it already points at
#  deploy/esphome/stackchan-dravix.yaml on main, which is now this firmware.
# ════════════════════════════════════════════════════════════════════════════════

# Your Wi-Fi: ESPHome → Secrets (top right) →   wifi_ssid: "YourWifi"
#                                               wifi_password: "your-password"
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

substitutions:
  device_name: "stackchan"          # its name on your network; keep it once Home Assistant knows it
  friendly_name: "Dravix"           # the name Home Assistant shows
  # wake_word_model: "okay_nabu"    # or "hey_jarvis", "hey_mycroft"
  # wake_sound_file: "https://…"    # your own chime before it listens (a URL)
  # speaker_ceiling: "0.9"          # 1.0 = full volume; 0.9 spares the small speaker

packages:
  dravix:
    url: https://github.com/YossiKon/dravix-os
    ref: main                       # or a tag / commit, to stay on one version
    refresh: 0s                     # look at GitHub on every Install
    files: [deploy/esphome/stackchan-dravix.yaml]
